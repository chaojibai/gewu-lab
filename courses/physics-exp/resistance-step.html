<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用电流表和电压表测量电阻（伏安法） · 格物实验室</title>
<style>
:root{
  --ink:#1d2a38; --dim:#66788c; --line:rgba(30,60,110,.14);
  --accent:#2f7dd1; --good:#1fa567; --warm:#e89a3c; --card:rgba(255,255,255,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e9edf2;color:var(--ink);
  font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding:14px 20px;font-size:13px;pointer-events:none;z-index:5}
.top a{color:var(--dim);text-decoration:none;pointer-events:auto}
.top a:hover{color:var(--ink)}
.chip{color:var(--accent);border:1px solid rgba(47,125,209,.35);background:rgba(255,255,255,.75);
  border-radius:99px;padding:2px 10px;font-size:12px}
.sp{flex:1}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:7px 14px;cursor:pointer;pointer-events:auto;transition:.15s;
  box-shadow:0 1px 3px rgba(30,60,110,.08)}
button:hover{background:#f2f7fd;border-color:rgba(47,125,209,.45)}
button:disabled{opacity:.32;cursor:default;box-shadow:none}
aside{position:fixed;top:70px;right:22px;width:400px;max-height:calc(100vh - 92px);
  overflow:hidden;background:var(--card);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;padding:14px 20px 18px;z-index:4;
  box-shadow:0 14px 40px rgba(30,60,110,.16);display:flex;flex-direction:column}
.pnav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:nowrap}
.pnav>button{padding:5px 11px;font-size:12.5px;border-radius:8px;flex:0 0 auto;
  white-space:nowrap;min-width:70px}
.dots{display:flex;gap:6px;flex:1 1 auto;justify-content:center;min-width:0;flex-wrap:wrap}
.dot{width:7px;height:7px;min-width:7px;flex:0 0 auto;border-radius:50%;background:rgba(30,60,110,.18);cursor:pointer;
  transition:.15s;border:0;padding:0}
.dot:hover{background:rgba(30,60,110,.4)}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px rgba(47,125,209,.18)}
.pstep{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);
  letter-spacing:.06em;margin-bottom:6px}
.pstep span:first-child{font-family:ui-monospace,Consolas,monospace;color:var(--accent)}
h1{font-size:19px;line-height:1.4;margin:0 0 8px;font-weight:600;color:#16232f}
.ask{margin:0 0 11px;padding:9px 12px;border-left:2px solid var(--warm);
  background:rgba(232,154,60,.10);border-radius:0 8px 8px 0;font-size:13.5px;color:#7c5316}
@keyframes panelIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.body.swap,.ctrls.swap{animation:panelIn .26s ease-out both}
.body{font-size:13.5px;color:#3d4c5e;margin-bottom:6px;overflow:auto;min-height:0;flex:1 1 auto;
  padding-right:6px;padding-bottom:14px;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);
  scrollbar-width:thin;scrollbar-color:rgba(30,60,110,.25) transparent}
.body::-webkit-scrollbar{width:5px}
.body::-webkit-scrollbar-thumb{background:rgba(30,60,110,.22);border-radius:99px}
.body p{margin:0 0 8px}
.body b{color:#16232f;font-weight:600}
.body code{font-family:ui-monospace,Consolas,monospace;background:rgba(47,125,209,.09);
  padding:1px 5px;border-radius:4px;font-size:12.5px;color:#22598f}
.ro{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.ro>div{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#f7f9fc}
.ro label{display:block;font-size:10.5px;color:var(--dim);margin-bottom:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ro b{font:600 14px/1.3 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;color:#1d2a38}
.ctl{margin:0 0 6px}
.ctlhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)}
.ctlhead b{color:var(--ink);font-family:ui-monospace,Consolas,monospace}
input[type=range]{width:100%;accent-color:var(--accent);margin:5px 0 8px}
button.act{display:block;width:100%;margin:5px 0;text-align:center;background:rgba(31,165,103,.10);
  border-color:rgba(31,165,103,.35);color:#14663f}
button.act:hover{background:rgba(31,165,103,.16)}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;color:#2a3846}
aside.quiz .ro{display:none}
.qopt.ok{border-color:#1fa567;background:rgba(31,165,103,.12);color:#0e6b40}
.qopt.no{border-color:#d9535f;background:rgba(217,83,95,.10);color:#a03040}
.fb{font-size:13px;margin-top:8px}
.fb.ok{color:#0e7a4b}
.fb.no{color:#b03a48}
.hint{position:fixed;left:20px;bottom:20px;font-size:11.5px;color:#8a97a6;z-index:3;pointer-events:none}
@media(max-width:1100px){
  aside{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:min(58vh,420px);overflow:auto}
  aside.quiz{max-height:min(82vh,560px)}
  .qopt{margin:4px 0;padding:7px 11px;font-size:13px}
  .ro{grid-template-columns:repeat(4,1fr);gap:7px}
  .ro b{font-size:13.5px}
  .pstep{display:none}
  .ask{padding:7px 10px;margin-bottom:9px;font-size:13px}
  .body{min-height:42px;font-size:13px}
  h1{font-size:17px;margin-bottom:6px}
  button.act{padding:6px 12px;margin:4px 0}
  .hint{display:none}
}

/* ---- 3D 标注层 ---- */
.lab-labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lab-label{position:absolute;left:0;top:0;color:#33475e;font-size:11.5px;line-height:1.2;
  text-shadow:0 1px 3px rgba(255,255,255,.95),0 0 7px rgba(255,255,255,.85);
  white-space:nowrap;will-change:transform;transition:opacity .28s linear}
.lab-label.on{color:#0b5c93;font-weight:600;background:rgba(255,255,255,.82);
  padding:1px 7px 2px;border-radius:99px;box-shadow:0 2px 8px rgba(20,60,100,.14)}
.curve{width:100%;height:auto;display:block;margin:0 0 10px;border-radius:10px;
  border:1px solid rgba(30,60,110,.12);background:#fbfcfe}

/* ---- 自设计图标与面板细节 ---- */
button.withicon{display:inline-flex;align-items:center;gap:5px;justify-content:center;flex:0 0 auto}
button.withicon svg{flex:0 0 auto}
button.withicon svg{opacity:.62}
button:hover.withicon svg{opacity:.9}
.pstep .pidx{display:inline-flex;align-items:center;gap:5px;font-family:ui-monospace,Consolas,monospace;
  color:var(--accent);letter-spacing:.04em}
.pstep .pidx svg{opacity:.75}
.pstep .pidx b{font-weight:600}
.ro>div{position:relative;overflow:hidden}
.ro>div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,rgba(47,125,209,.55),rgba(47,125,209,.12))}
.ro b{color:#16232f}
.curve{margin-top:2px}

/* ---- 3D 悬停提示 ---- */
.lab-tip{position:fixed;display:none;pointer-events:none;z-index:7;max-width:280px;
  padding:5px 9px;border-radius:8px;font-size:12px;line-height:1.35;
  background:rgba(255,255,255,.97);border:1px solid rgba(58,92,126,.45);color:#16324a;
  box-shadow:0 8px 20px rgba(30,60,90,.18);transform:translate(-50%,-150%)}

/* ---- 上次进度提示 ---- */
.resume-hint{margin-left:10px;font-size:12px;padding:4px 10px;border-radius:99px;
  background:rgba(47,125,209,.1);border:1px solid rgba(47,125,209,.35);
  color:#2f6ea8;cursor:pointer;pointer-events:auto;font:inherit}
.resume-hint:hover{background:rgba(47,125,209,.18)}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-left" viewBox="0 0 16 16"><path d="M10 3.2 5.2 8l4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 16 16"><path d="M6 3.2 10.8 8 6 12.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13.2 2.6v2.9h-2.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-flask" viewBox="0 0 16 16"><path d="M6.2 2.2h3.6M6.9 2.4v3.1L3.5 12a1.2 1.2 0 0 0 1 1.8h7a1.2 1.2 0 0 0 1-1.8L9.1 5.5V2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.2 9.4h5.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".6"/></symbol>
  <symbol id="i-ruler" viewBox="0 0 16 16"><rect x="2.2" y="5.4" width="11.6" height="5.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 5.6v2M7.4 5.6v2.8M9.8 5.6v2M12.2 5.6v2.8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity=".8"/></symbol>
</svg>

<canvas id="cv"></canvas>

<div class="top">
  <a href="index.html">← 目录</a>
  <span class="chip">物理 · 鲁教版 · 九上 · 第十五章 欧姆定律 · 第三节 电阻的测量</span>
  <span class="sp"></span>
  <button id="resetView" class="withicon"><svg width="13" height="13"><use href="#i-rotate"/></svg>重置视角</button>
</div>

<aside>
  <div class="pnav">
    <button id="prev" class="withicon"><svg width="13" height="13"><use href="#i-left"/></svg>上一步</button>
    <div class="dots" id="dots"></div>
    <button id="next" class="withicon">下一步<svg width="13" height="13"><use href="#i-right"/></svg></button>
  </div>
  <div class="ro" id="ro"></div>
  <div class="pstep"><span class="pidx"><svg width="12" height="12"><use href="#i-flask"/></svg><b id="sIdx">01 / 08</b></span><span id="sName"></span></div>
  <h1 id="sTitle"></h1>
  <p class="ask" id="sAsk"></p>
  <div class="body" id="sBody"></div>
  <div id="sCtrls"></div>
</aside>

<div class="hint">拖空白处旋转视角 · 滚轮缩放</div>

<script>
/* 格物实验室 · 仿真模型层
   所有读数/现象由物理化学模型计算，不是时间线脚本。
   单位约定：浓度 mol/L，体积 mL，物质的量 mol，温度 ℃，压强 kPa，气体体积 mL。 */
window.Sim = (function () {
  'use strict';

  var Kw25 = 1e-14;

  /* 水的离子积随温度变化（近似：ln Kw 随 1/T 线性） */
  function kw(tC) {
    var T = tC + 273.15;
    var dH = 55900;                       /* J/mol */
    return Kw25 * Math.exp(-dH / 8.314 * (1 / T - 1 / 298.15));
  }

  /* 强酸-强碱体系 pH：物料守恒 + 水的自偶电离精确解
     cB/vB 碱（NaOH），cA/vA 酸（HCl）。返回 pH。 */
  function pH(o) {
    var nB = (o.cB || 0) * (o.vB || 0) / 1000;
    var nA = (o.cA || 0) * (o.vA || 0) / 1000;
    var v = ((o.vB || 0) + (o.vA || 0)) / 1000;
    var K = kw(o.temp === undefined ? 25 : o.temp);
    if (v <= 0) return 7;
    var D = (nB - nA) / v;                /* >0 碱过量，<0 酸过量 */
    var s = Math.sqrt(D * D + 4 * K);
    var OH = (D + s) / 2;                 /* [OH-] */
    var H = K / OH;                       /* [H+] */
    if (H <= 0) return 7;
    return -Math.log10(H);
  }

  /* 生成滴定曲线：[{v, pH}] */
  function curve(o, vMax, step) {
    step = step || .5;
    var out = [], v;
    for (v = 0; v <= vMax + 1e-9; v += step) {
      out.push({ v: v, pH: pH({ cB: o.cB, vB: o.vB, cA: o.cA, vA: v, temp: o.temp }) });
    }
    return out;
  }

  /* 等当点体积（mL）：中和所需酸的体积 */
  function equivalence(o) {
    if (!o.cA) return 0;
    return (o.cB * o.vB) / o.cA;
  }

  /* 酚酞显色：pH<8.2 无色，8.2~10 渐红，>10 全红。返回 0..1 */
  function phenolphthalein(p) {
    return Math.max(0, Math.min(1, (p - 8.2) / 1.6));
  }

  /* 石蕊：酸红（0）→ 中紫（.5）→ 碱蓝（1） */
  function litmus(p) {
    return Math.max(0, Math.min(1, (p - 4.5) / 4.5));
  }

  /* 理想气体：V(mL) = nRT/p */
  function gasVolume(o) {
    var T = (o.temp === undefined ? 25 : o.temp) + 273.15;
    var p = (o.p === undefined ? 101.3 : o.p) * 1000;   /* Pa */
    return (o.n || 0) * 8.314 * T / p * 1e6;            /* m³ → mL */
  }

  /* 排水集气：收集到体积 V 所需气体物质的量 */
  function molesForVolume(VmL, o) {
    o = o || {};
    var T = (o.temp === undefined ? 25 : o.temp) + 273.15;
    var p = (o.p === undefined ? 101.3 : o.p) * 1000;
    return VmL * 1e-6 * p / (8.314 * T);
  }

  /* 稀释：c1·V1 = c2·(V1+V2) */
  function dilute(c1, v1, v2) {
    return c1 * v1 / (v1 + v2);
  }

  /* 摩尔质量表（g/mol） */
  var MM = {
    O2: 32, CO2: 44, H2: 2, H2O: 18,
    NaOH: 40, HCl: 36.5, CaCO3: 100, KMnO4: 158,
    CuSO4: 160, Fe: 56, S: 32, P: 31, Mg: 24, Zn: 65, Cu: 64

  /* n = m / M */
  function moles(mass, formula) {
    return mass / (MM[formula] || 1);
  }

  /* 阿伦尼乌斯温度因子（相对 25℃） */
  function arrhenius(tC, Ea) {
    var T = tC + 273.15, T0 = 298.15;
    Ea = Ea === undefined ? 50000 : Ea;
    return Math.exp(-Ea / 8.314 * (1 / T - 1 / T0));
  }

    phenolphthalein: phenolphthalein, litmus: litmus,
    gasVolume: gasVolume, molesForVolume: molesForVolume,
    dilute: dilute, moles: moles, MM: MM, arrhenius: arrhenius
  };
})();

/* 程序化火焰纹理：叶形裁剪 + 竖直多段色带（焰心/内焰/外焰）+ 亮核 + 边缘羽化
   kind: 'candle'（蜡烛）| 'alcohol'（酒精灯）| 'burner'（喷灯，偏蓝锥） */
var FLAME_TEX_CACHE = {};
function makeFlameTex(kind) {
  kind = kind || 'candle';
  if (FLAME_TEX_CACHE[kind]) return FLAME_TEX_CACHE[kind];

  var W = 256, H = 512;
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var x = c.getContext('2d');
  x.clearRect(0, 0, W, H);

  /* 叶形轮廓：底宽、顶尖，两侧内收（蜡烛火的真实形状） */
  function leafPath() {
    x.beginPath();
    x.moveTo(128, 16);
    x.bezierCurveTo(196, 150, 232, 300, 152, 458);
    x.bezierCurveTo(140, 474, 116, 474, 104, 458);
    x.bezierCurveTo(24, 300, 60, 150, 128, 16);
    x.closePath();
  }

  x.save();
  leafPath();
  x.clip();

  /* 竖直色带：从底部焰心（蓝）→ 白黄 → 橙 → 顶端渐隐 */
  var g = x.createLinearGradient(0, 470, 0, 20);
  if (kind === 'alcohol') {
    g.addColorStop(0, 'rgba(140,182,255,1)');
    g.addColorStop(.16, 'rgba(190,222,255,1)');
    g.addColorStop(.42, 'rgba(236,246,255,1)');
    g.addColorStop(.68, 'rgba(186,208,250,1)');
    g.addColorStop(.86, 'rgba(158,188,246,.6)');
    g.addColorStop(1, 'rgba(150,182,240,0)');
  } else if (kind === 'burner') {
    g.addColorStop(0, 'rgba(120,170,255,.85)');
    g.addColorStop(.28, 'rgba(170,210,255,.95)');
    g.addColorStop(.6, 'rgba(210,235,255,.75)');
    g.addColorStop(.85, 'rgba(180,210,255,.3)');
    g.addColorStop(1, 'rgba(170,200,255,0)');
  } else {
    g.addColorStop(0, 'rgba(118,168,255,.60)');   /* 焰心：淡蓝（石蜡蒸气） */
    g.addColorStop(.12, 'rgba(186,220,255,.80)');
    g.addColorStop(.22, 'rgba(255,249,220,1)');   /* 内焰：白黄最亮 */
    g.addColorStop(.45, 'rgba(255,214,120,.98)');
    g.addColorStop(.70, 'rgba(255,150,55,.86)');  /* 外焰：橙 */
    g.addColorStop(.88, 'rgba(255,112,28,.42)');
    g.addColorStop(1, 'rgba(255,92,18,0)');
  }
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);

  /* 亮核：偏下的一团白光（让火焰"有芯"） */
  var core = x.createRadialGradient(128, 360, 8, 128, 360, kind === 'candle' ? 92 : 70);
  core.addColorStop(0, kind === 'candle' ? 'rgba(255,255,246,.95)' : 'rgba(245,252,255,.9)');
  core.addColorStop(.45, kind === 'candle' ? 'rgba(255,236,170,.55)' : 'rgba(210,235,255,.5)');
  core.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = core;
  x.fillRect(0, 0, W, H);

  /* 紊流：极淡的横向扰动带，避免渐变过于"塑料" */
  for (var i = 0; i < 26; i++) {
    var yy = 60 + Math.random() * 380;
    var rr = 10 + Math.random() * 26;
    var gg = x.createRadialGradient(128 + (Math.random() - .5) * 60, yy, 1,
      128 + (Math.random() - .5) * 60, yy, rr);
    gg.addColorStop(0, 'rgba(255,255,255,.05)');
    gg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gg;
    x.fillRect(0, 0, W, H);
  }
  x.restore();

  /* 边缘羽化：先复制整图，再用 blur 重绘（径向遮罩会把火焰顶部裁掉，实测翻车） */
  var tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  tmp.getContext('2d').drawImage(c, 0, 0);
  x.clearRect(0, 0, W, H);
  if (typeof x.filter === 'string') {
    x.filter = 'blur(2.5px)';
    x.drawImage(tmp, 0, 0);
    x.filter = 'none';
  } else {
    x.drawImage(tmp, 0, 0);        /* 老浏览器不支持 filter，退回不羽化 */
  }

  var t = new T.CanvasTexture(c);
  FLAME_TEX_CACHE[kind] = t;
  return t;
}

function flameTexture() {
  var c = document.createElement('canvas');

  g.addColorStop(0, 'rgba(255,252,230,1)');

  g.addColorStop(.55, 'rgba(255,140,50,.55)');

/* 环境贴图：仿 three 的 RoomEnvironment（房间盒 + 发光面板），PMREM 捕获。

   否则反射是一片均匀白，金属件会像哑光塑料。 */
function makeEnvMap() {
  var pmrem = new T.PMREMGenerator(renderer);
  var env = new T.Scene();
  /* 房间内壁：略暗，作为反射的“暗部底” */
  var room = new T.Mesh(
    new T.BoxGeometry(34, 22, 34),
    new T.MeshStandardMaterial({ color: 0xc6ccd3, side: T.BackSide, roughness: 1 }));
  room.position.y = 5; env.add(room);

  var gnd = new T.Mesh(new T.PlaneGeometry(34, 34),
    new T.MeshStandardMaterial({ color: 0x6b727a, roughness: .95 }));
  gnd.position.y = -5; gnd.rotation.x = Math.PI / 2; env.add(gnd);
  /* 四面暗墙：侧向反射有结构（避免一片均匀白） */
  [[-17, 0], [17, 0], [0, -17], [0, 17]].forEach(function (p) {
    var w = new T.Mesh(new T.PlaneGeometry(14, 16),
      new T.MeshStandardMaterial({ color: 0x3c434b, roughness: .85 }));
    w.position.set(p[0], 5, p[1]);
    if (p[0] !== 0) w.rotation.y = Math.PI / 2;
    env.add(w);
  });
  /* 顶部主灯板（亮，反射高光） */
  var panel = new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 16 });
  var main = new T.Mesh(new T.PlaneGeometry(13, 13), panel);
  main.position.set(0, 12.5, 0); main.rotation.x = Math.PI / 2; env.add(main);
  /* 侧向亮窗（反射条纹 → 金属上的高光带） */
  for (var i = 0; i < 4; i++) {
    var win = new T.Mesh(new T.PlaneGeometry(2.6, 10),
      new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0xcfe6ff, emissiveIntensity: 9 }));
    win.position.set(-13 + i * 8.6, 6, 16.9); env.add(win);
  }
  var rt = pmrem.fromScene(env, .04);
  scene.environment = rt.texture;
  pmrem.dispose();
}

/* ---------------- 图元辅助 ---------------- */
function V(x, y, z) { return new T.Vector3(x, y, z); }

function mesh(geo, mat, cast, recv) {
  var m = new T.Mesh(geo, mat);
  m.castShadow = cast !== false;
  m.receiveShadow = recv !== false;
  world.add(m);
  return m;
}

var K = {};


/* 液体竖向渐变贴图：底部更深（纵深吸收） */
function liquidGradient(col, darkK) {
  var c = document.createElement('canvas');
  c.width = 4; c.height = 128;
  var x = c.getContext('2d');
  var base = new T.Color(col);
  var top = base.clone().multiplyScalar(1.0);
  var bot = base.clone().multiplyScalar(darkK === undefined ? .55 : darkK);
  var g = x.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0, '#' + top.getHexString());      /* 顶部（v=1） */
  g.addColorStop(.55, '#' + base.clone().multiplyScalar(.8).getHexString());
  g.addColorStop(1, '#' + bot.getHexString());      /* 底部（v=0） */
  var t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.ClampToEdgeWrapping;
  return t;
}


/* 液体材质：单网格片元着色器 —— 高度吸收渐变（无接缝）+ 边缘暗化 + 液面高光 */
function liquidMaterial(col, yBot, yTop, opts) {
  opts = opts || {};
  var base = new T.Color(col);
  var deep = base.clone().multiplyScalar(opts.deepK === undefined ? .55 : opts.deepK);
  var shallow = base.clone().multiplyScalar(opts.topK === undefined ? 1.0 : opts.topK);
  return new T.ShaderMaterial({
    uniforms: {
      uBot: { value: yBot },
      uTop: { value: yTop },
      uDeep: { value: deep },
      uShallow: { value: shallow },
      uLight: { value: new T.Vector3(.45, .82, .35).normalize() },
      uOpacity: { value: opts.opacity === undefined ? 1 : opts.opacity }
    },
    vertexShader:
      'varying vec3 vW; varying vec3 vN;' +
      'void main(){' +
      ' vec4 wp = modelMatrix * vec4(position,1.0);' +
      ' vW = wp.xyz;' +
      ' vN = normalize(mat3(modelMatrix) * normal);' +
      ' gl_Position = projectionMatrix * viewMatrix * wp; }',
    fragmentShader:
      'uniform float uBot; uniform float uTop;' +
      'uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uLight; uniform float uOpacity;' +
      'varying vec3 vW; varying vec3 vN;' +
      'void main(){' +
      ' float h = clamp((vW.y - uBot) / max(0.001, uTop - uBot), 0.0, 1.0);' +
      ' vec3 base = mix(uDeep, uShallow, smoothstep(0.0, 1.0, h));' +
      ' vec3 V = normalize(cameraPosition - vW);' +
      ' float fres = pow(1.0 - max(dot(normalize(vN), V), 0.0), 3.0);' +
      ' base *= (1.0 - fres * 0.52);' +          /* 贴壁处显著加深 */
      ' base += uShallow * (1.0 - fres) * 0.10;' +      /* 内部略亮，形成"体积感" */
      ' base = mix(base, vec3(0.96), fres * fres * 0.22);' +  /* 极边缘的湿润光泽 */
      ' float up = smoothstep(0.75, 0.98, normalize(vN).y);' +
      ' if (up > 0.01) {' +                      /* 液面：略亮 + 紧致高光 */
      '   vec3 hv = normalize(uLight + V);' +
      '   float spec = pow(max(dot(normalize(vN), hv), 0.0), 110.0);' +
      '   base = mix(base, uShallow * 1.02, up * 0.45) + vec3(spec * 0.42);' +
      ' }' +
      ' float a = mix(uOpacity, uOpacity * 0.74, up);' +
      ' gl_FragColor = vec4(base, a);' +
      '}',
    transparent: true,
    depthWrite: true
  });
}


/* 轮廓线自适应：器皿越小，线越实（three 的 linewidth 在多数平台无效，只能靠颜色/透明度补偿） */
function lineTone(r, base) {
  var k = Math.max(.45, Math.min(1.6, 5.2 / Math.max(1.2, r)));
  return { op: Math.min(.92, (base || .5) * k), color: r < 3 ? 0x6b8ca8 : 0x7f9fb8 };
}

/* 玻璃口沿线：LineLoop 圆环 + 母线，保证任何背景上都锐利可读 */
var LINE_MAT = null;
function lineMat(op) {
  return new T.LineBasicMaterial({ color: 0x7d9db8, transparent: true, opacity: op === undefined ? .62 : op });
}
function ringLine(parent, cx, cz, y, r, op) {
  var tone = lineTone(r, op);
  op = tone.op;
  var pts = [], n = 64, i, a;
  for (i = 0; i <= n; i++) {
    a = i / n * Math.PI * 2;
    pts.push(new T.Vector3(cx + Math.cos(a) * r, y, cz + Math.sin(a) * r));
  }
  var l = new T.LineLoop(new T.BufferGeometry().setFromPoints(pts.slice(0, n)),
    new T.LineBasicMaterial({ color: tone.color, transparent: true, opacity: op }));
  (parent || world).add(l);
  return l;
}
/* 竖向柔和高光：用 additive 渐变面片替代硬母线（圆柱玻璃更真实） */
function softStreak(parent, cx, cz, y0, y1, r, angle) {
  var c = document.createElement('canvas');
  c.width = 48; c.height = 128;
  var x2 = c.getContext('2d');
  x2.clearRect(0, 0, 48, 128);
  var g1 = x2.createLinearGradient(0, 0, 48, 0);
  g1.addColorStop(0, 'rgba(255,255,255,0)');
  g1.addColorStop(.5, 'rgba(255,255,255,.85)');
  g1.addColorStop(1, 'rgba(255,255,255,0)');
  x2.fillStyle = g1; x2.fillRect(0, 0, 48, 128);
  var g2 = x2.createLinearGradient(0, 0, 0, 128);
  g2.addColorStop(0, 'rgba(255,255,255,0)');
  g2.addColorStop(.25, 'rgba(255,255,255,1)');
  g2.addColorStop(.75, 'rgba(255,255,255,1)');
  g2.addColorStop(1, 'rgba(255,255,255,0)');
  x2.globalCompositeOperation = 'destination-in';
  x2.fillStyle = g2; x2.fillRect(0, 0, 48, 128);
  var tex = new T.CanvasTexture(c);
  var m = new T.Mesh(new T.PlaneGeometry(r * .5, y1 - y0),
    new T.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false,
      blending: T.AdditiveBlending, opacity: .45 }));
  var a = angle === undefined ? -.72 : angle;
  m.position.set(cx + Math.sin(a) * r * .99, (y0 + y1) / 2, cz + Math.cos(a) * r * .99);
  m.rotation.y = a;
  parent.add(m);
  return m;
}

function sideLines(parent, cx, cz, y0, y1, r, op) {
  var tone = lineTone(r, op === undefined ? .16 : op);
  op = tone.op;
  var pts = [];
  pts.push(new T.Vector3(cx - r, y0, cz), new T.Vector3(cx - r, y1, cz));
  pts.push(new T.Vector3(cx + r, y0, cz), new T.Vector3(cx + r, y1, cz));
  var g = new T.BufferGeometry().setFromPoints(pts);
  var l = new T.LineSegments(g, lineMat(op === undefined ? .45 : op));
  (parent || world).add(l);
  return l;
}

/* 菲涅尔亮边壳：让玻璃轮廓在浅背景上可读 */
var fresMat = null, haloMat = null;
function fresnelMaterial() {
  if (fresMat) return fresMat;
  fresMat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.AdditiveBlending,
    uniforms: { uColor: { value: new T.Color(0x5f8ab0) }, uK: { value: 1.05 } },
    vertexShader:
      'varying vec3 vN; varying vec3 vV;' +
      'void main(){ vN = normalize(normalMatrix * normal);' +
      ' vec4 mv = modelViewMatrix * vec4(position,1.);' +
      ' vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader:
      'varying vec3 vN; varying vec3 vV; uniform vec3 uColor; uniform float uK;' +
      'void main(){ float f = pow(1. - abs(dot(normalize(vN), normalize(vV))), 2.4);' +
      ' gl_FragColor = vec4(uColor, f * uK); }'
  });
  return fresMat;
}
function addFresnel(mesh, scale, noHalo) {
  var sh = new T.Mesh(mesh.geometry, fresnelMaterial());
  sh.scale.setScalar(scale || 1.015);
  sh.castShadow = false; sh.receiveShadow = false;
  mesh.add(sh);
  /* BackSide 外扩光晕：玻璃轮廓在任何背景上都可读 */
  if (noHalo) return sh;
  if (!haloMat) haloMat = new T.MeshBasicMaterial({
    color: 0x6f9ec4, transparent: true, opacity: .32,
    side: T.BackSide, depthWrite: false
  });
  var halo = new T.Mesh(mesh.geometry, haloMat);
  halo.scale.setScalar((scale || 1.015) * 1.035);
  halo.castShadow = false; halo.receiveShadow = false;
  mesh.add(halo);
  return sh;
}

/* 玻璃圆筒（开口 + 口沿） */
K.glassCyl = function (o) {
  o = o || {};
  var r = o.r || 5, h = o.h || 10, x = o.x || 0, z = o.z || 0, y0 = o.y0 || 0;
  var g = new T.Group();
  var gmat = o.glassMat || M.glass;
  var wall = new T.Mesh(
    new T.CylinderGeometry(r, r, h, 48, 1, true), gmat);
  wall.position.set(x, y0 + h / 2, z);
  g.add(wall);
  var rim = new T.Mesh(new T.TorusGeometry(r, Math.max(.12, r * .028), 10, 48), M.glass);
  rim.rotation.x = Math.PI / 2;
  rim.position.set(x, y0 + h, z);
  g.add(rim);
  var bot = new T.Mesh(new T.TorusGeometry(r, Math.max(.1, r * .024), 10, 48), M.glass);
  bot.rotation.x = Math.PI / 2;
  bot.position.set(x, y0 + .06, z);
  g.add(bot);
  wall.renderOrder = 3;
  addFresnel(wall, 1.02);
  ringLine(g, x, z, y0 + h, r, .7);
  ringLine(g, x, z, y0 + .02, r, .5);
  if (o.side === true) sideLines(g, x, z, y0, y0 + h, r, .4);   /* 默认不画竖母线：浅背景下它像假竖纹 */
  world.add(g);
  return g;
};

/* 圆柱液体（带顶面） */
K.liquidCyl = function (o) {
  o = o || {};
  var r = o.r || 4.8, h = o.h || 5, x = o.x || 0, z = o.z || 0, y0 = o.y0 || 0;
  var col = o.color || 0x2f7fb8;
  var op = o.opacity === undefined ? .88 : o.opacity;
  var mat = liquidMaterial(col, y0, y0 + h, { deepK: .6, opacity: op });
  var m = new T.Mesh(new T.CylinderGeometry(r, r, h, 40), mat);
  m.position.set(x, y0 + h / 2, z);
  m.castShadow = false;
  m.receiveShadow = false;
  world.add(m);
  return m;
};

/* 液体平面（升降液面） */
K.liquidTop = function (o) {
  o = o || {};
  var r = o.r || 4.8, x = o.x || 0, z = o.z || 0, y = o.y || 0;
  var col = o.color || 0x2f7fb8;
  var mat = new T.MeshStandardMaterial({
    color: col, roughness: .22, transparent: true, opacity: .92,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
  });
  var m = new T.Mesh(new T.CircleGeometry(r, 40), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y + .015, z);   /* 抬高一点，避免与液体顶盖共面打架 */
  world.add(m);
  return m;
};

/* 锥形瓶：Lathe 轮廓 + 内部液体 */
K.flask = function (o) {
  o = o || {};
  var baseR = o.baseR || 5, bodyH = o.bodyH || 9, neckR = o.neckR || 1.6, neckH = o.neckH || 4;
  var x = o.x || 0, z = o.z || 0, y0 = o.y0 || 0;
  var liq = o.liquid === undefined ? .5 : o.liquid;
  var liqCol = o.liquidCol || 0x2f7fb8;
  var liqA = o.liquidA === undefined ? .92 : o.liquidA;
  var inset = o.liqInset === undefined ? .3 : o.liqInset;   /* 液体与瓶壁的间隙 */
  var g = new T.Group();

  var pts = [], N = 32, i;
  var shR = neckR * 1.55, shT = .78;          /* 肩部半径与起始位置 */
  function flaskR(t) {                        /* t: 0..1 沿瓶身 */
    if (t <= shT) return baseR + (shR - baseR) * (t / shT);
    var k = (t - shT) / (1 - shT);
    return shR + (neckR - shR) * (k * k * (3 - 2 * k));   /* smoothstep 肩部 */
  }
  for (i = 0; i <= N; i++) {
    var t = i / N, y = bodyH * t;
    pts.push([flaskR(t), y]);
  }
  var prof = [new T.Vector2(.05, 0)];
  for (i = 0; i < pts.length; i++) prof.push(new T.Vector2(pts[i][0], pts[i][1] + .5));
  var body = new T.Mesh(new T.LatheGeometry(prof, 48), o.glassMat || M.glass);
  body.castShadow = false;
  g.add(body);

  /* 内壁：略小的同一轮廓（法线朝内），与外壁一起构成真实玻璃厚度，
     液体夹在两壁之间，从正面看就是"玻璃罩着液体" */
  (function () {
    var inner = [], ii2, ip;
    for (ii2 = 0; ii2 < prof.length; ii2++) {
      ip = prof[ii2];
      var shrink = (ip.y < .8) ? .02 : .28;
      inner.push(new T.Vector2(Math.max(.03, ip.x - shrink), ip.y));
    }
    var wall = new T.Mesh(new T.LatheGeometry(inner, 44), new T.MeshPhysicalMaterial({
      color: 0xf4fafd, roughness: .05, metalness: 0,
      transparent: true, opacity: .2, side: T.BackSide,
      depthWrite: false, envMapIntensity: 1.6, clearcoat: .6, clearcoatRoughness: .1
    }));
    wall.renderOrder = 4;
    g.add(wall);
  })();
  body.renderOrder = 3;
  addFresnel(body, 1.015, true);
  var rim = new T.Mesh(new T.TorusGeometry(neckR * 1.1, .16, 10, 40), M.glass);
  rim.rotation.x = Math.PI / 2;
  rim.position.y = bodyH + .5 + neckH;
  g.add(rim);
  var neck = new T.Mesh(new T.CylinderGeometry(neckR, neckR, neckH, 40, 1, true), o.glassMat || M.glass);
  neck.position.y = bodyH + .5 + neckH / 2;
  neck.castShadow = false;
  g.add(neck);
  neck.renderOrder = 3;
  addFresnel(neck, 1.03, true);

  if (liq > .01) {
    var lv = [];
    var ly = .5 + bodyH * liq * .95;
    var lr = flaskR(Math.min(1, (ly - .5) / bodyH));
    lv.push(new T.Vector2(.05, .5));
    var j, m;
    for (j = 0; j <= 10; j++) {
      m = j / 10;
      var yy = .5 + (ly - .5) * m;
      var rr = baseR + (neckR - baseR) * Math.pow(m * liq * .95, .8) * (ly - .5 > 0 ? 1 : 0);
      rr = flaskR(Math.min(1, (yy - .5) / bodyH)) - .12;
      lv.push(new T.Vector2(Math.max(.05, rr - inset), yy));
    }
    lv.push(new T.Vector2(.05, ly));
    var lm = new T.Mesh(new T.LatheGeometry(lv, 40),
      liquidMaterial(liqCol, .5, ly, { deepK: .62, opacity: 1 }));
    lm.name = 'liquid';
    lm.renderOrder = 2;
    g.add(lm);

    /* 贴壁薄壳：紧贴瓶壁的一层更深液体，填掉液体与玻璃之间的缝，
       与主体叠在一起读成"有厚度的液体"（而不是实心色块） */
    var shellPts = [], sj;
    for (sj = 0; sj <= 14; sj++) {
      var st = sj / 14;
      var sy2 = .5 + (ly - .5) * st;
      var sr2 = flaskR(Math.min(1, (sy2 - .5) / bodyH)) - Math.max(.05, inset * .16);
      shellPts.push(new T.Vector2(Math.max(.04, sr2), sy2));
    }
    var shell = new T.Mesh(new T.LatheGeometry(shellPts, 44),
      new T.MeshBasicMaterial({
        color: new T.Color(liqCol).multiplyScalar(.42),
        transparent: true, opacity: .78,
        side: T.BackSide, depthWrite: false
      }));
    shell.name = 'liquidShell';
    shell.renderOrder = 1;
    g.add(shell);
    /* 液面高光圈（白亮环） */
    var men = [], mi, ma;
    var mr = Math.max(.1, flaskR(Math.min(1, (ly - .5) / bodyH)) - inset);
    for (mi = 0; mi <= 48; mi++) {
      ma = mi / 48 * Math.PI * 2;
      men.push(new T.Vector3(Math.cos(ma) * mr, ly + .012, Math.sin(ma) * mr));
    }
    var menLine = new T.LineLoop(new T.BufferGeometry().setFromPoints(men.slice(0, 48)),
      new T.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .5 }));
    menLine.name = 'liquidMen';   /* 液面动态升降时随液面走 */
    g.add(menLine);
    /* 液面与瓶壁的接触暗线（液体贴壁处的深色细环） */
    var menDark = [];
    for (mi = 0; mi < 48; mi++) {
      ma = mi / 48 * Math.PI * 2;
      menDark.push(new T.Vector3(Math.cos(ma) * (mr + .03), ly - .06, Math.sin(ma) * (mr + .03)));
    }
    var menDarkLine = new T.LineLoop(new T.BufferGeometry().setFromPoints(menDark),
      new T.LineBasicMaterial({ color: 0x6a2b3a, transparent: true, opacity: .3 }));
    menDarkLine.name = 'liquidMenDark';
    g.add(menDarkLine);
  }
  /* 瓶壁竖向高光：模拟窗户在玻璃上的镜面反射条（玻璃感的关键线索） */
  (function () {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 256;
    var x2 = c.getContext('2d');
    var g2 = x2.createLinearGradient(0, 0, 0, 256);
    g2.addColorStop(0, 'rgba(255,255,255,0)');
    g2.addColorStop(.18, 'rgba(255,255,255,.75)');
    g2.addColorStop(.55, 'rgba(255,255,255,.95)');
    g2.addColorStop(.9, 'rgba(255,255,255,.35)');
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    x2.fillStyle = g2;
    /* 中间亮、两侧渐隐的竖条 */
    var gx2 = x2.createLinearGradient(0, 0, 64, 0);
    gx2.addColorStop(0, 'rgba(255,255,255,0)');
    gx2.addColorStop(.45, 'rgba(255,255,255,1)');
    gx2.addColorStop(.55, 'rgba(255,255,255,1)');
    gx2.addColorStop(1, 'rgba(255,255,255,0)');
    x2.fillRect(0, 0, 64, 256);
    x2.globalCompositeOperation = 'destination-in';
    x2.fillStyle = gx2;
    x2.fillRect(0, 0, 64, 256);
    var tex = new T.CanvasTexture(c);
    var mat = new T.MeshBasicMaterial({
      map: tex, transparent: true, blending: T.AdditiveBlending,
      depthWrite: false, opacity: .5
    });
    var hgt = (bodyH + neckH) * .92;
    var pl = new T.Mesh(new T.PlaneGeometry(baseR * .55, hgt), mat);
    pl.position.set(-baseR * .46, (bodyH + neckH) * .5, baseR * .72);
    g.add(pl);
  })();

  /* 玻璃轮廓线（引擎级）：底环 + 颈下环 + 两条母线 */
  (function () {
    var shR2 = neckR * 1.55, shT2 = .78;
    function ring(yy, rr, op) {
      var tone = lineTone(rr, op);
      op = tone.op;
      var pts = [], kk;
      for (kk = 0; kk <= 56; kk++) {
        var aa = kk / 56 * Math.PI * 2;
        pts.push(new T.Vector3(Math.cos(aa) * rr, yy, Math.sin(aa) * rr));
      }
      g.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(pts.slice(0, 56)),
        new T.LineBasicMaterial({ color: tone.color, transparent: true, opacity: op })));
    }
    ring(.5, baseR, .5);
    ring(bodyH + .5, neckR, .6);
    ring(bodyH * shT2 + .5, shR2, .34);
    ring(bodyH + .5 + neckH, neckR, .65);
    [-1, 1].forEach(function (sgn) {
      var vp = [new T.Vector3(sgn * baseR, .5, 0),
                new T.Vector3(sgn * neckR, bodyH + .5, 0)];
      g.add(new T.LineSegments(new T.BufferGeometry().setFromPoints(vp),
        new T.LineBasicMaterial({ color: 0x7f9fb8, transparent: true, opacity: .42 })));
    });
  })();

  g.position.set(x, y0, z);
  if (o.name) K.tag(g, o.name, o.desc || '');
  world.add(g);
  return g;
};

/* 试管（圆底，任意方向） */
K.testTube = function (o) {
  o = o || {};
  var r = o.r || 1.2, h = o.h || 12;
  var pos = o.pos || [0, 0, 0], dir = o.dir || [0, 1, 0];
  var liq = o.liquid || 0, liqCol = o.liquidCol || 0x3a86c8;
  var pts = [new T.Vector2(.05, 0)];
  var i;
  for (i = 1; i <= 6; i++) {
    var a = (i / 6) * Math.PI / 2;
    pts.push(new T.Vector2(r * Math.sin(a), r * (1 - Math.cos(a))));
  }
  pts.push(new T.Vector2(r, h));
  var geo = new T.LatheGeometry(pts, 32);
  var m = new T.Mesh(geo, M.glass);
  m.castShadow = false;
  addFresnel(m, 1.02);
  var d = V(dir[0], dir[1], dir[2]).normalize();
  var q = new T.Quaternion().setFromUnitVectors(V(0, 1, 0), d);
  m.applyQuaternion(q);
  m.position.set(pos[0], pos[1], pos[2]);
  var g = new T.Group();
  g.add(m);
  if (liq > .02) {
    var lp = [new T.Vector2(.05, 0)];
    for (i = 1; i <= 6; i++) {
      var a2 = (i / 6) * Math.PI / 2;
      lp.push(new T.Vector2((r - .1) * Math.sin(a2), r * (1 - Math.cos(a2))));
    }
    lp.push(new T.Vector2(r - .1, h * liq * .95));
    lp.push(new T.Vector2(.05, h * liq * .95));
    var lm = new T.Mesh(new T.LatheGeometry(lp, 24),
      new T.MeshPhysicalMaterial({ color: liqCol, roughness: .25, transmission: .3, thickness: 1.5, transparent: true, opacity: .9 }));
    lm.applyQuaternion(q);
    lm.position.set(pos[0], pos[1], pos[2]);
    g.add(lm);
  }
  world.add(g);
  return g;
};

/* 烧杯 */
K.beaker = function (o) {
  o = o || {};
  var r = o.r || 5, h = o.h || 10, x = o.x || 0, z = o.z || 0;
  var g = K.glassCyl({ r: r, h: h, x: x, z: z, y0: o.y0 || 0 });
  var spout = new T.Mesh(new T.SphereGeometry(r * .12, 10, 8), M.glass);
  spout.scale.set(1.6, .7, 1);
  spout.position.set(x + r, (o.y0 || 0) + h - .3, z);
  g.add(spout);
  return g;
};

/* 软管/玻璃管：沿折线 */
K.tube = function (pts, r, o) {
  o = o || {};
  r = r || .35;
  var arr = [];
  for (var i = 0; i < pts.length; i++) arr.push(V(pts[i][0], pts[i][1], pts[i][2]));
  var curve = new T.CatmullRomCurve3(arr);
  var mat = o.rubber
    ? new T.MeshStandardMaterial({ color: o.color || 0x39414c, roughness: .8 })
    : new T.MeshPhysicalMaterial({ color: 0xffffff, roughness: .1, transmission: .85, thickness: .3, ior: 1.45, transparent: true, opacity: .5, side: T.DoubleSide });
  var m = new T.Mesh(new T.TubeGeometry(curve, Math.max(24, pts.length * 6), r, 10), mat);
  m.castShadow = !o.rubber;
  if (!o.rubber) addFresnel(m, 1.06);
  world.add(m);
  return m;
};

/* 金属杆（两点间） */
K.rod = function (p0, p1, r, o) {
  o = o || {};
  var a = V(p0[0], p0[1], p0[2]), b = V(p1[0], p1[1], p1[2]);
  var d = new T.Vector3().subVectors(b, a);
  var len = d.length();
  var m = new T.Mesh(new T.CylinderGeometry(r, r, len, 14), o.mat || M.iron);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), d.clone().normalize());
  world.add(m);
  return m;
};

K.box = function (o) {
  o = o || {};
  var m = new T.Mesh(new T.BoxGeometry(o.sx, o.sy, o.sz), o.mat || new T.MeshStandardMaterial({ color: o.color || 0x8f98a2, roughness: .6 }));
  m.position.set(o.x || 0, o.y || 0, o.z || 0);
  world.add(m);
  return m;
};

/* 圆角盒（倒角几何）：干掉刀切直边，是“真实感”的关键。
   算法：把 BoxGeometry 每个顶点向内侧盒（各面向内缩 r）的球面推 r。 */
K.geoRoundBox = function (w, h, d, r, seg) {
  r = Math.max(.01, Math.min(r === undefined ? .15 : r, Math.min(w, h, d) / 2 - 1e-3));
  seg = seg || 3;
  var g = new T.BoxGeometry(w, h, d, seg, seg, seg);
  var p = g.attributes.position, v = new T.Vector3();
  var hx = w / 2 - r, hy = h / 2 - r, hz = d / 2 - r;
  for (var i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    var ix = Math.max(-hx, Math.min(hx, v.x));
    var iy = Math.max(-hy, Math.min(hy, v.y));

  'uniform float uTime; uniform float uSeed; uniform float uOpacity; uniform vec3 uTint;',
  'uniform vec3 uC0; uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3;',
  'float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }',
  'float noise(vec2 p){ vec2 i=floor(p),f=fract(p);',
  '  float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));',
  '  vec2 u=f*f*(3.-2.*f); return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }',
  'float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.0; a*=.5; } return v; }',
  'void main(){',

  '  float sway=(fbm(vec2(y*1.6, uTime*0.8+uSeed))-0.5)*0.55*pow(y,0.7);',
  '  float cx=0.5+sway;',
  '  float hw=mix(0.36,0.04,pow(y,0.7));',
  '  hw*=(0.55+0.7*fbm(vec2(y*4.0, uTime*1.6+uSeed)));',
  '  float d=abs(x-cx)/max(hw,0.02);',
  '  float body=1.0-smoothstep(0.0,1.0,d);',
  '  float n1=fbm(vec2(x*3.0, y*4.0 - uTime*2.6 + uSeed));',
  '  float n2=fbm(vec2(x*7.0+5.0, y*6.0 - uTime*3.6 + uSeed));',

  '  float breakUp=mix(1.0, smoothstep(0.32,0.62, n2 + (1.0-y)*0.35), smoothstep(0.4,0.92,y));',

  [GY + 52, GY + 49.4].forEach(function (py, pi) {
    var pipe = new T.Mesh(new T.CylinderGeometry(pi ? .7 : 1.1, pi ? .7 : 1.1, 240, 14), pipeMat);
    pipe.rotation.z = Math.PI / 2; pipe.position.set(0, py, ZB + 2.4); scene.add(pipe);
  });
  for (var hx = -110; hx <= 110; hx += 28) {
    var hg = new T.Mesh(new T.BoxGeometry(.7, 6.5, .7), trussMat);
    hg.position.set(hx, GY + 54.4, ZB + 2.4); scene.add(hg);
  }
};

K.bench = function (w, d) {
  w = w || 60; d = d || 34;
  var g = new T.Group();
  var TOP_H = 2.4, H = 13.2;

  var topMat = new T.MeshPhysicalMaterial({
    color: 0x171d21, roughness: .55, metalness: .06, envMapIntensity: .3,
    clearcoat: .3, clearcoatRoughness: .5, map: benchTexture()
  });
  var top = new T.Mesh(new T.BoxGeometry(w + 2, TOP_H, d + 2), topMat);
  top.position.y = -TOP_H / 2;
  top.castShadow = true; top.receiveShadow = true;
  g.add(top);

  /* 挡水槽（四周一圈下凹细槽）。槽宽收窄到 .24：
     原来 .36 在近景里是一圈很粗的黑框，看着像给桌面装了个画框 */
  var gm = new T.MeshStandardMaterial({ color: 0x11161a, roughness: .85 });
  var gi = 2.4, gw = .24;
  function groove(px, pz, sx, sz) {
    var m = new T.Mesh(new T.BoxGeometry(sx, .2, sz), gm);
    m.position.set(px, .02, pz);
    g.add(m);
  }
  groove(0, d / 2 + 1 - gi, (w / 2 + 1 - gi) * 2, gw);
  groove(0, -d / 2 - 1 + gi, (w / 2 + 1 - gi) * 2, gw);
  groove(w / 2 + 1 - gi, 0, gw, (d / 2 + 1 - gi) * 2);
  groove(-w / 2 - 1 + gi, 0, gw, (d / 2 + 1 - gi) * 2);

  /* 台面前缘倒角 */
  var edge = new T.Mesh(new T.BoxGeometry(w + 2, .24, .22),
    new T.MeshStandardMaterial({ color: 0x59666f, roughness: .3, metalness: .45 }));
  edge.position.set(0, -.1, d / 2 + 1);
  g.add(edge);

  /* 台面下沿的暗缝：给台面一点厚度与接地感。
     近景（dist<40）时桌腿和柜门都在画面外，只靠这条暗缝和挡板，
     观众才不会觉得桌面是"浮在空中" */
  var under = new T.Mesh(new T.BoxGeometry(w + 2, .55, d + 2),
    new T.MeshStandardMaterial({ color: 0x30373d, roughness: .9 }));
  under.position.y = -TOP_H - .12;
  g.add(under);

  /* 前挡板（原来用接近背景的浅灰 0xcfd6de，浅背景下等于隐形，看不出桌体） */
  var apron = new T.Mesh(new T.BoxGeometry(w - 1, 3.4, .7),
    new T.MeshStandardMaterial({ color: 0x9ba5b0, roughness: .58, metalness: .05 }));
  apron.position.set(0, -TOP_H - 1.7, d / 2 - .5);
  apron.castShadow = true;
  g.add(apron);

  /* 四条桌腿（深灰钢，浅背景下给桌面一个"落地"的锚点） */
  var legMat = new T.MeshStandardMaterial({ color: 0x3a434d, roughness: .5, metalness: .6 });
  [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(function (sg) {
    var leg = new T.Mesh(new T.BoxGeometry(1.1, H - TOP_H, 1.1), legMat);
    leg.position.set(sg[0] * (w / 2 - 2.2), -TOP_H - (H - TOP_H) / 2, sg[1] * (d / 2 - 2.2));
    leg.castShadow = true;
    g.add(leg);
  });
  /* 踢脚线 */
  var skirt2 = new T.Mesh(new T.BoxGeometry(w - 1, .8, d - 1),
    new T.MeshStandardMaterial({ color: 0x262d34, roughness: .7 }));
  skirt2.position.y = -H + .4;
  g.add(skirt2);

  /* 柜体（加深，别在浅背景里隐形） */
  var cabMat = new T.MeshPhysicalMaterial({ color: 0x99a3ae, roughness: .55, metalness: .08, envMapIntensity: .45, clearcoat: .25, clearcoatRoughness: .4 });
  var cab = new T.Mesh(new T.BoxGeometry(w - 2.5, H - TOP_H - 3.2, d - 2.5), cabMat);
  cab.position.y = -TOP_H - 3.2 - (H - TOP_H - 3.2) / 2;
  cab.receiveShadow = true;
  g.add(cab);

  /* 柜门 + 拉手 */
  var doorCount = 3, doorW = (w - 6) / doorCount;
  var doorMat = new T.MeshPhysicalMaterial({ color: 0xb8c2cc, roughness: .5, metalness: .05, clearcoat: .3, clearcoatRoughness: .35 });
  var handleMat = new T.MeshStandardMaterial({ color: 0xa9b2bb, roughness: .28, metalness: .9, envMapIntensity: 1.2 });
  for (var i = 0; i < doorCount; i++) {
    var dx = -(w - 6) / 2 + doorW / 2 + i * doorW;
    var dh = H - TOP_H - 5.2;
    var door = new T.Mesh(new T.BoxGeometry(doorW - .5, dh, .5), doorMat);
    door.position.set(dx, -TOP_H - 4.3 - dh / 2, d / 2 - 1.2);
    door.castShadow = true;
    g.add(door);
    var handle = new T.Mesh(new T.BoxGeometry(Math.min(6, doorW * .5), .42, .42), handleMat);
    handle.position.set(dx, -TOP_H - 5.6, d / 2 - .86);
    g.add(handle);
  }

  /* 踢脚 */
  var kick = new T.Mesh(new T.BoxGeometry(w - 6, 3.2, d - 5),
    new T.MeshStandardMaterial({ color: 0x2b3238, roughness: .75 }));
  kick.position.y = -H + 1.6;
  g.add(kick);

  /* 侧板 */
  [-1, 1].forEach(function (sgn) {
    var side = new T.Mesh(new T.BoxGeometry(.8, H - TOP_H - 3.2, d - 2.5), cabMat);
    side.position.set(sgn * (w - 3) / 2, -TOP_H - 3.2 - (H - TOP_H - 3.2) / 2, 0);
    g.add(side);
  });

  world.add(g);
  return g;
};


/* ---------------- 拾取交互：悬停提示 + 点击聚焦 ---------------- */
var ray = null, tipEl = null, hoverObj = null, camTween = null;
var spriteLabels = [];

K.tag = function (obj, name, desc) {
  if (obj) obj.userData.tag = { name: name, desc: desc || '' };
  return obj;
};

function ensureTip() {
  if (tipEl) return tipEl;
  tipEl = document.createElement('div');
  tipEl.className = 'lab-tip';
  document.body.appendChild(tipEl);
  return tipEl;
}

function ndcFromEvent(e) {
  var r = cv.getBoundingClientRect();
  return {
    x: ((e.clientX - r.left) / r.width) * 2 - 1,
    y: -((e.clientY - r.top) / r.height) * 2 + 1,
    px: e.clientX, py: e.clientY
  };
}

function pickAt(e) {
  if (!ray) ray = new T.Raycaster();
  var n = ndcFromEvent(e);
  ray.setFromCamera(new T.Vector2(n.x, n.y), camera);
  var hits = ray.intersectObjects(world.children, true);
  for (var i = 0; i < hits.length; i++) {
    var o = hits[i].object;
    while (o && o !== world) {
      if (o.userData && o.userData.tag) return { tag: o.userData.tag, obj: o, point: hits[i].point };
      o = o.parent;
    }
  }
  return null;
}

function focusOn(obj) {
  var box = new T.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  var c = box.getCenter(new T.Vector3());
  var r = box.getSize(new T.Vector3()).length() * .5;
  camTween = {
    t: 0, dur: .55,
    from: { tx: cam.tx, ty: cam.ty, tz: cam.tz, dist: cam.dist },
    to: { tx: c.x, ty: c.y, tz: c.z, dist: Math.max(16, r * 3.1) }
  };
}

function updateLabelScale() {
  for (var i = 0; i < spriteLabels.length; i++) {
    var L = spriteLabels[i];
    var d = L.sp.position.distanceTo(camera.position);
    var k = Math.max(.6, Math.min(2.4, d / L.ref));
    L.sp.scale.set(L.w * k, L.h * k, 1);
  }
}

function updateTween(dt) {
  if (!camTween) return;
  camTween.t = Math.min(1, camTween.t + dt / camTween.dur);
  var k = camTween.t, e = k < .5 ? 2 * k * k : -1 + (4 - 2 * k) * k;
  cam.tx = K.lerp(camTween.from.tx, camTween.to.tx, e);
  cam.ty = K.lerp(camTween.from.ty, camTween.to.ty, e);
  cam.tz = K.lerp(camTween.from.tz, camTween.to.tz, e);
  cam.dist = K.lerp(camTween.from.dist, camTween.to.dist, e);
  if (camTween.t >= 1) camTween = null;
}

function bindPick() {
  var down = null;
  cv.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener('pointerup', function (e) {
    if (!down) return;
    var moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    down = null;
    if (moved > 6) return;                     /* 拖动旋转不算点击 */
    var hit = pickAt(e);
    if (hit) focusOn(hit.obj);
  });
  cv.addEventListener('pointermove', function (e) {
    if (drag) { hideTip(); return; }
    if (cv.__pt && Date.now() - cv.__pt < 55) return;
    cv.__pt = Date.now();
    var hit = pickAt(e);
    var tip = ensureTip();
    if (hit) {
      hoverObj = hit.obj;
      tip.textContent = hit.tag.name + (hit.tag.desc ? ' · ' + hit.tag.desc : '');
      tip.style.display = 'block';
      tip.style.left = e.clientX + 'px';
      tip.style.top = e.clientY + 'px';
      cv.style.cursor = 'pointer';
    } else {
      hoverObj = null;
      hideTip();
      cv.style.cursor = 'grab';
    }
  });
}

function hideTip() {
  if (tipEl) tipEl.style.display = 'none';
}


/* ---------------- 键盘操作 + 学习进度 ---------------- */
function courseKey() {
  var f = location.pathname.split('/').pop() || 'course';
  return 'gw:progress:' + f.replace('.html', '');
}

function saveProgress(step, done) {
  try {
    var rec = { step: step, done: !!done, at: Date.now() };
    localStorage.setItem(courseKey(), JSON.stringify(rec));
    localStorage.setItem('gw:last', JSON.stringify({ file: location.pathname.split('/').pop(), at: Date.now() }));
  } catch (e) {}
}

function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem(courseKey()) || 'null');
  } catch (e) { return null; }
}

function bindKeyboard() {
  window.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { goStep(stepIdx + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { goStep(stepIdx - 1); }
    else if (e.key === 'r' || e.key === 'R') { Object.assign(cam, CAM0); camTween = null; }
    else if (e.key === 'Escape') { hideTip(); }
  });
}

/* 顶部“上次看到第 N 步”提示（可点继续） */
function showResumeHint(rec) {
  if (!rec || !rec.step) return;
  var el = document.createElement('button');
  el.className = 'resume-hint';
  el.textContent = '上次看到第 ' + (rec.step + 1) + ' 步 · 继续';
  el.onclick = function () { goStep(rec.step); el.remove(); };
  var top = document.querySelector('.top');
  if (top) top.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.remove(); }, 12000);
}
/* ---------------- UI（沿用原面板逻辑） ---------------- */
var ui = {};

var composer = null, ssaoPass = null;
/* 可选后期：Bloom + sRGB 终合。仅当课件传 postfx:true 且已注入 addons 时启用 */
function setupPostfx() {
  if (!T.EffectComposer || !T.RenderPass) return;
  /* 走 HDR 管线：场景先不做色调映射渲染进半浮点 RT，Bloom 在 HDR 上做，
     最后由终合 Pass 统一做 ACES + sRGB。这样只有真正的高光（>1）才发光。 */
  renderer.toneMapping = T.NoToneMapping;
  /* RT 用 CSS 尺寸创建，随后 composer.setPixelRatio(DPR) 统一把 RT 与所有 pass
     放大到物理像素。若这里传 W*DPR 又调 setSize(W,H)，composer 内部 _pixelRatio
     仍是 1，会把 HDR 缓冲压回 CSS 尺寸 —— 2x 超采样等于白做。 */
  var rt = new T.WebGLRenderTarget(W, H, { type: T.HalfFloatType, encoding: T.LinearEncoding });
  composer = new T.EffectComposer(renderer, rt);
  if (composer.setPixelRatio) composer.setPixelRatio(DPR);
  /* SSAOPass 自己渲染场景（含 AO 合成），有它就不再加 RenderPass，避免重复渲染 */
  if (T.SSAOPass) {
    ssaoPass = new T.SSAOPass(scene, camera, W * DPR, H * DPR);
    var so = (cfg && cfg.ssao) || {};
    ssaoPass.kernelRadius = so.kernelRadius || 14;
    ssaoPass.minDistance = so.minDistance || 0.0012;
    ssaoPass.maxDistance = so.maxDistance || 0.14;
    ssaoPass.output = T.SSAOPass.OUTPUT.Default;
    composer.addPass(ssaoPass);
  } else {
    composer.addPass(new T.RenderPass(scene, camera));
  }
  if (T.UnrealBloomPass) {
    /* 浅色实验室课件可传 cfg.bloom 压泛光；默认 .38 保持不变 */
    composer.addPass(new T.UnrealBloomPass(new T.Vector2(W, H),
      cfg.bloom !== undefined ? cfg.bloom : .38, .25, 1.1));
  }
  var FinalShader = {
    /* cfg.exposure 控制终合 ACES 曝光；浅色实验室建议 .78 */
    uniforms: { tDiffuse: { value: null },
      uExposure: { value: cfg.exposure !== undefined ? cfg.exposure : .9 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:
      'uniform sampler2D tDiffuse; uniform float uExposure; varying vec2 vUv;' +
      'vec3 aces(vec3 x){ float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14; return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0); }' +
      'void main(){ vec4 c=texture2D(tDiffuse,vUv); vec3 col=aces(c.rgb*uExposure); col=pow(col,vec3(1.0/2.2)); gl_FragColor=vec4(col,c.a); }'
  };
  composer.addPass(new T.ShaderPass(FinalShader));
  composer.setSize(W, H);
}

function boot(c) {
  cfg = c;
  state = c.state || (c.state = {});
  if (c.cam) {
    Object.assign(cam, c.cam);
    CAM0 = Object.assign({}, cam);
  }
  buildMaterials();
  init3d();
  document.title = c.title + ' · 格物实验室';
  document.querySelector('.chip').textContent = c.chip;
  document.querySelector('.hint').textContent = c.hint || '拖空白处旋转视角 · 滚轮缩放';

  labelWrap = document.createElement('div');
  labelWrap.className = 'lab-labels';
  document.body.appendChild(labelWrap);

  ui.idx = document.getElementById('sIdx');
  ui.name = document.getElementById('sName');
  ui.title = document.getElementById('sTitle');
  ui.ask = document.getElementById('sAsk');
  ui.body = document.getElementById('sBody');
  ui.ctrls = document.getElementById('sCtrls');
  ui.ro = document.getElementById('ro');
  ui.dots = document.getElementById('dots');
  ui.prev = document.getElementById('prev');
  ui.next = document.getElementById('next');

  ui.ro.innerHTML = (c.reads || []).map(function (r) {
    return '<div><label>' + r[1] + '</label><b data-k="' + r[0] + '">—</b></div>';
  }).join('');

  ui.body.addEventListener('click', function (e) {
    var opt = e.target.closest('[data-opt]');
    if (opt && quizPick === null) {
      quizPick = opt.getAttribute('data-opt');
      renderPanel();
      return;
    }
    if (e.target.id === 'again') { quizData = null; quizPick = null; state._quiz = null; renderPanel(); }
  });

  ui.prev.onclick = function () { goStep(stepIdx - 1); };
  ui.next.onclick = function () { goStep(stepIdx + 1); };
  document.getElementById('resetView').onclick = function () {
    /* 有逐步机位就飞回本步机位；没有就回到开课时的手动机位 */
    if (curStepCam) flyTo(curStepCam, .55);
    else { camTween = null; Object.assign(cam, CAM0); }
  };

  bindPointer();
  bindPick();
  bindKeyboard();
  resize();
  window.addEventListener('resize', resize);

  if (cfg.scene && cfg.scene.setup) cfg.scene.setup();
  if (cfg.postfx) setupPostfx();
  window.__labDebug = { scene: scene, M: M, renderer: renderer, cam: cam, camera: camera, composer: composer };
  goStep(0);
  requestAnimationFrame(loop);
}

function resize() {
  DPR = SS;
  W = window.innerWidth; H = window.innerHeight;
  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  if (composer) composer.setSize(W, H);
}

/* ── 步骤过渡 ──────────────────────────────────────────────
   apply() 里大量直接写 position/rotation/scale，切步骤时器材会瞬移。
   这里在 apply 前后各拍一次变换快照，对变化的对象做 0.55s 缓入缓出补间。
   每帧在 scene.update 之前推进：若某对象的位置由 update 每帧重算，补间
   会被 update 覆盖（不生效也不抖动）；只在 apply 一次定型的器材上生效。 */
var _stepTweens = null;
function snapshotStepTransforms() {
  var snap = new Map();
  scene.traverse(function (o) {
    if (o === scene || o.isLight || o.isCamera || o.isSprite) return;
    if (BGREF.roomDecor && BGREF.roomDecor.indexOf(o) >= 0) return;
    if (!o.visible) return;
    snap.set(o.uuid, { p: o.position.clone(), q: o.quaternion.clone(), s: o.scale.clone() });
  });
  return snap;
}
function beginStepTweens(snap) {
  _stepTweens = [];
  window.__stepTweens = 0;
  if (!snap) return;
  var _dbg = { snap: snap.size, seen: 0, miss: 0, moved: 0 };
  scene.traverse(function (o) {
    if (o === scene || o.isLight || o.isCamera || o.isSprite) return;
    if (BGREF.roomDecor && BGREF.roomDecor.indexOf(o) >= 0) return;
    _dbg.seen++;
    var b = snap.get(o.uuid);
    if (!b) { _dbg.miss++; return; }
    if (!o.visible) return;
    var moved = b.p.distanceToSquared(o.position) > 4e-4;
    var turned = b.q.angleTo(o.quaternion) > 1e-3;
    var scaled = b.s.distanceToSquared(o.scale) > 4e-4;
    if (!moved && !turned && !scaled) return;
    _dbg.moved++;
    _stepTweens.push({ o: o, p0: b.p, p1: o.position.clone(), q0: b.q, q1: o.quaternion.clone(),
      s0: b.s, s1: o.scale.clone(), t: 0, dur: .55 });
    o.position.copy(b.p); o.quaternion.copy(b.q); o.scale.copy(b.s);
  });
  window.__stepDebug = _dbg;
}
function updateStepTweens(dt) {
  if (!_stepTweens || !_stepTweens.length) return;
  for (var i = _stepTweens.length - 1; i >= 0; i--) {
    var tw = _stepTweens[i];
    tw.t = Math.min(1, tw.t + dt / tw.dur);
    var e = tw.t < .5 ? 2 * tw.t * tw.t : -1 + (4 - 2 * tw.t) * tw.t;
    tw.o.position.lerpVectors(tw.p0, tw.p1, e);
    tw.o.quaternion.slerpQuaternions(tw.q0, tw.q1, e);
    tw.o.scale.lerpVectors(tw.s0, tw.s1, e);
    if (tw.t >= 1) {
      tw.o.position.copy(tw.p1); tw.o.quaternion.copy(tw.q1); tw.o.scale.copy(tw.s1);
      _stepTweens.splice(i, 1);
    }
  }
  window.__stepTweens = _stepTweens.length;
}

var _stepBooted = false;
var _stepPending = null;   // { pre: 快照, frames }：等 update 跑完一帧再比对
function goStep(i) {
  stepIdx = Math.max(0, Math.min(i, cfg.steps.length - 1));
  quizPick = null;
  quizData = null;
  var s = cfg.steps[stepIdx];
  /* 记录切换前的数值，apply 后对突变项做补间（避免"一下多出来/一下少了"） */
  var before = {};
  Object.keys(state).forEach(function (k) {
    if (typeof state[k] === 'number') before[k] = state[k];
  });
  /* 很多课件 apply 只改状态、位置在下一帧 update 里才重算，所以 apply 前后
     直接比对抓不到跳变。这里只拍 apply 前的快照，等 update 跑过一帧再比。 */
  var _pre = _stepBooted ? snapshotStepTransforms() : null;
  if (s.apply) s.apply(state);
  _stepPending = _pre ? { pre: _pre, frames: 0 } : null;
  _stepBooted = true;
  /* 逐步机位：步骤里写 cam:{...} 就平滑推过去；没写就沿用当前视角。
     用户一旦拖动/滚轮，补间立即中断，控制权交还给人。 */
  if (s.cam) flyTo(s.cam, s.camDur);
  else camTween = null;
  curStepCam = s.cam || null;
  saveProgress(stepIdx, stepIdx === cfg.steps.length - 1);
  state.__ramps = [];
  Object.keys(before).forEach(function (k) {
    if (k.charAt(0) === '_') return;
    var now = state[k];
    if (typeof now !== 'number') return;
    var d = Math.abs(now - before[k]);
    if (d < 1e-6) return;
    /* 变化幅度超过 12% 且不是计数器类，才做补间 */
    var base = Math.max(1e-6, Math.abs(before[k]));
    if (d / base < .12 && d < .5) return;
    state.__ramps.push({ k: k, from: before[k], to: now, t: 0, dur: .55 });
    state[k + 'T'] = now;   /* 目标值快照：面板读数用它，避免显示补间中间值 */
    state[k] = before[k];
  });
  renderPanel();

      }
      [1.25, 2.15, 3.05, 3.95, 4.85, 5.62].forEach(function (yy, i) {
        var major = i % 2 === 0, len = (major ? 1.05 : .62) * s;

          return new T.BoxGeometry(len, .085 * s, .055 * s);
        }), MAT.mark);
        bar.name = 'MAT_mark__mark_' + i;
        bar.position.set(Math.sin(angB) * RB, yy * s, Math.cos(angB) * RB);
        bar.rotation.y = angB;
        g.add(bar);
        if (major) addNum(String((i / 2 + 1) * 50), yy, len / 2 + .62 * s);
      });
      addNum('mL', 5.92, .85 * s);
      var ax = new T.Mesh(new T.BoxGeometry(.085 * s, 4.55 * s, .055 * s), MAT.mark);
      ax.name = 'MAT_mark__mark_axis';

    if (o.liquid > 0) {

  /* ② 锥形瓶 250mL：厚壁 + 卷口 + 磨砂颈环 + 肩部刻度 */
  BUILD.flask = function (o) {
    var g = group('CHEM_FLASK'), s = o.scale;
    /* 标准锥形瓶（Erlenmeyer）：平底 → 短直壁 → 一条直线斜壁收到细颈 → 短直颈 → 卷口。
       旧版用了 5 个中间点做圆弧肩，画成了奶瓶/圆底烧瓶，形状不合规。 */
    var R = 3.0 * s, neckR = 1.05 * s, H = 8.0 * s;

      [R, 1.15 * s],                 // 下段直壁
      [neckR + .25 * s, 6.05 * s],  // 一条直线斜肩（锥台）
      [neckR, 6.45 * s],            // 肩颈过渡
      [neckR, H - .30 * s],         // 直颈
      [neckR + .12 * s, H - .18 * s],
      [neckR + .13 * s, H - .03 * s],
      [neckR + .02 * s, H + .05 * s]

    /* 单层壁：不再回折出内壁。双层闭合轮廓在 opacity .3 下内外壁叠加
       正是"奶白色、没有玻璃质感"的根源。底部只用一个薄圆盘封口。 */
    put(g, new T.Mesh(lathe(prof, 56), MAT.glass), 'body');
    /* 底面用极淡的独立材质，不再和壁叠成奶白圆盘 */
    put(g, new T.Mesh(new T.CircleGeometry(R - .30 * s, 48).rotateX(-PI / 2),
      new T.MeshBasicMaterial({ color: 0xb9d2e4, transparent: true, opacity: .10,
        side: T.DoubleSide, depthWrite: false })), 'base', [0, .11 * s, 0]);
    var bead = torus(neckR + .07 * s, .085 * s, MAT.rim, 44);
    bead.rotation.x = PI / 2; put(g, bead, 'rim_bead', [0, H + .02 * s, 0]);
    /* 磨砂颈环 + 刻度短线（贴在斜壁上，随半径收缩） */
    var frost = torus(neckR + .01 * s, .035 * s, MAT.frost, 40);
    frost.rotation.x = PI / 2; put(g, frost, 'neck_frost', [0, 7.3 * s, 0]);
    if (o.marks !== false) {
      /* 刻度贴合斜壁：斜壁是直线 (R,1.15s)→(neckR+.25s,6.05s)，
         每条刻度的壁半径由直线方程求出，bar 贴在壁外表面 z=r+.03 */
      var slY0 = 1.15 * s, slY1 = 6.05 * s;
      var slR0 = R, slR1 = neckR + .25 * s;
      [[1.9, 0], [3.0, 1], [4.1, 0], [5.2, 1]].forEach(function (mk, k) {
        var yy = mk[0] * s, t = (yy - slY0) / (slY1 - slY0);
        var rr = slR0 + (slR1 - slR0) * t;
        var len = (mk[1] ? .72 : .45) * s;
        /* 刻度必须落在半径 rr 的圆周上。旧写法 x=-rr*.88、z=rr+.035
           组合后实际半径约 1.36rr，整条刻度悬在瓶壁外面（放大像浮空）。 */
        var ang = .5, R2 = rr + .035 * s;

          return new T.BoxGeometry(len, .06 * s, .04 * s);
        }), MAT.mark);
        bar.name = 'MAT_mark__mark_' + k;
        bar.position.set(Math.sin(ang) * R2, yy, Math.cos(ang) * R2);
        bar.rotation.y = ang;   /* 长边沿圆周切线，整条贴壁 */
        g.add(bar);

      put(g, new T.Mesh(new T.CylinderGeometry(Math.min(rTop, R - .2 * s), R - .25 * s, lh, 40),

  /* ③ 酒精灯：扁球灯体（壁厚）+ 灯芯座 + 棉芯 + 焦头 + 旁置灯帽 + 酒精液面 */
  BUILD.lamp = function (o) {
    var g = group('CHEM_LAMP'), s = o.scale, H = 2.6 * s, R = 1.52 * s, w = .12 * s;
    var outer = [], N = 16;
    for (var i = 0; i <= N; i++) {

      return new T.BoxGeometry(.30 * s, .12 * s, .46 * s);
    }), MAT.metalD), 'collar_ear', [.58 * s, H - .30 * s, 0]);
    put(g, cyl(.17 * s, .19 * s, .72 * s, MAT.wick, 18), 'wick', [0, H + .16 * s, 0]);
    var tip = new T.Mesh(new T.SphereGeometry(.19 * s, 14, 10), MAT.char);
    tip.scale.set(1, .72, 1); put(g, tip, 'wick_tip', [0, H + .52 * s, 0]);
    if (o.cap !== false) {
      var cap = group('CHEM_LAMP_CAP');
      put(cap, cyl(.62 * s, .66 * s, .74 * s, MAT.cap, 30), 'cap_body', [0, .37 * s, 0]);
      put(cap, cyl(.60 * s, .60 * s, .10 * s, MAT.cap, 30), 'cap_top', [0, .78 * s, 0]);
      put(cap, new T.Mesh(new T.SphereGeometry(.20 * s, 14, 10), MAT.cap), 'cap_knob', [0, .92 * s, 0]);
      var cr = torus(.62 * s, .055 * s, MAT.metalD, 30);
      cr.rotation.x = PI / 2; put(cap, cr, 'cap_ring', [0, .08 * s, 0]);

  /* ⑦ 水槽（玻璃缸，带卷口） */
  BUILD.trough = function (o) {
    var g = group('CHEM_TROUGH'), s = o.scale, R = 6.0 * s, H = 4.0 * s;
    /* 单层壁：开放圆柱（无内壁），底面单独一片。
       双层闭合轮廓在 transmission 下内外壁互相折射会产生密集竖条纹。 */
    put(g, new T.Mesh(new T.CylinderGeometry(R, R, H, 56, 1, true), MAT.glassTank), 'wall');
    /* 口沿线由 outline() 的 ringLine 画一圈即可，这里不再叠 Torus 环
       （上版把环误放在 H/2 半腰，读作"刻度/光环不贴合"）。 */
    if (o.water > 0) {
      /* w 只属于烧杯/量筒的局部变量，这里原先误用会直接抛 ReferenceError，
         导致所有课件被迫传 water:0 —— 排水量气法的水槽里一直没有水。 */
      var wh = o.water * (H - .6 * s);
      var wy = .3 * s + wh;
      /* 水体贴住玻璃内壁：旧版 rW = R-.22 让水体的侧壁在玻璃里再画一层
         "内筒"，平视就是一只双层水槽。留 .05 只为避免与玻璃同半径打架。 */
      var rW = R - .05 * s;
      /* 水体侧壁若用 DoubleSide 半透明圆柱，近侧 + 远侧会与玻璃壁叠成
         「第二个内筒」，平视读作双层水槽；再叠一条硬水位线就是第二条缸口。
         现在：侧壁只画远侧(BackSide)，按局部 y 上下渐隐，不留任何硬边；
         水位由水面圆盘的菲涅尔边缘自然读出，不再单独画 ringLine。 */
      var bodyMat = new T.ShaderMaterial({
        transparent: true, depthWrite: false, side: T.BackSide,
        uniforms: { uColor: { value: new T.Color(0x6fb0d0) }, uH: { value: wh } },
        vertexShader: 'varying float vY;' +
          'void main(){ vY = position.y;' +
          ' gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
        fragmentShader: 'varying float vY; uniform vec3 uColor; uniform float uH;' +
          'void main(){ float t = clamp(vY / uH + .5, 0., 1.);' +
          ' float fade = smoothstep(0., .20, t) * (1. - smoothstep(.70, 1., t));' +
          ' gl_FragColor = vec4(uColor, .24 * fade); }'
      });
      put(g, new T.Mesh(new T.CylinderGeometry(rW, rW, wh, 48, 1, true), bodyMat),
        'water_wall', [0, .3 * s + wh / 2, 0]);
      /* 水面：菲涅尔反射。正俯视几乎透明，掠射角才亮 —— 真实水面不会
         在俯视下变成一块不透明色板。整体压淡，避免平视时又是一条亮带。 */
      var surfMat = new T.ShaderMaterial({
        transparent: true, depthWrite: false, side: T.DoubleSide,
        uniforms: { uColor: { value: new T.Color(0x8fd0e8) }, uR: { value: rW } },
        vertexShader: 'varying vec3 vN; varying vec3 vV; varying vec3 vP;' +
          'void main(){ vP = position; vN = normalize(normalMatrix * normal);' +
          ' vec4 mv = modelViewMatrix * vec4(position,1.);' +
          ' vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
        fragmentShader: 'varying vec3 vN; varying vec3 vV; varying vec3 vP;' +
          'uniform vec3 uColor; uniform float uR;' +
          'void main(){ float f = pow(1. - abs(dot(normalize(vN), normalize(vV))), 2.2);' +
          /* 盘缘淡出：掠射角下整片水面会压成一条硬直亮线，边缘不虚化

          ' float rr = length(vP.xz) / uR;' +
          ' float edge = 1. - smoothstep(.74, 1.0, rr);' +
          ' gl_FragColor = vec4(uColor, (.035 + .20 * f) * edge); }'
      });
      var surf = new T.Mesh(new T.CircleGeometry(rW - .02 * s, 48).rotateX(-PI / 2), surfMat);
      put(g, surf, 'water_surface', [0, wy, 0]);
    }
    return g;
  };

  /* ⑫ 玻璃棒 */

  /* ══ 凸透镜 / 光屏 / 光具座 / 支座 ═════════════════════ */
  function convexLens(opts) {
    opts = opts || {};
    /* 真双凸：前后两面都是球面，边缘留 Te 厚度（真透镜不是刀锋边）。
       旧版只画了半面（一面凸一面平）、再套一根 .25 粗的深色环，
       浅背景下玻璃隐形，就只剩一个「铁圈」。 */
    var R = opts.r || 3.2, Tc = opts.th || 1.9, Te = opts.edge || .2;
    var MK = M();
    var g = new T.Group();
    var sag = (Tc - Te) / 2;
    var Rc = (R * R + sag * sag) / (2 * sag);      // 球面曲率半径
    function halfZ(r) { return Tc / 2 - (Rc - Math.sqrt(Math.max(0, Rc * Rc - r * r))); }
    var pts = [], N = 14;
    for (var i = N; i >= 0; i--) pts.push(new T.Vector2(i / N * R, -halfZ(i / N * R)));  // 后表面
    for (var j = 1; j <= N; j++) pts.push(new T.Vector2(j / N * R, halfZ(j / N * R)));   // 前表面
    var lens = new T.Mesh(new T.LatheGeometry(pts, 48), new T.MeshPhysicalMaterial({
      color: 0xd6ecff, roughness: .01, metalness: 0,
      transparent: true, opacity: .34, side: T.DoubleSide, depthWrite: false,
      clearcoat: 1, clearcoatRoughness: .01, envMapIntensity: 2.0
    }));
    lens.renderOrder = 2; g.add(lens);
    /* 轮廓：两条镜像母线 + 前后口沿。浅背景下玻璃靠线定形，不靠调白 */
    var lineMat = new T.LineBasicMaterial({ color: 0x5d86a8, transparent: true, opacity: .7 });
    [1, -1].forEach(function (sg) {
      var lp = [];
      for (var k = 0; k <= 24; k++) {
        var r = k / 24 * R;
        lp.push(new T.Vector3(r, sg * halfZ(r), 0));
      }
      g.add(new T.Line(new T.BufferGeometry().setFromPoints(lp), lineMat));
    });
    [halfZ(R), -halfZ(R)].forEach(function (yy) {
      var cp = [];
      for (var k = 0; k < 48; k++) {
        var a = k / 48 * Math.PI * 2;
        cp.push(new T.Vector3(Math.cos(a) * R, yy, Math.sin(a) * R));
      }
      g.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(cp), lineMat));
    });
    /* 边缘磨砂厚度环（读作玻璃断面）+ 细金属夹框（只夹边，不遮镜面） */
    var edge = new T.Mesh(new T.TorusGeometry(R, Te * .62, 8, 48),
      new T.MeshPhysicalMaterial({ color: 0xcfe4f2, roughness: .35, metalness: 0,
        transparent: true, opacity: .42, depthWrite: false }));
    edge.rotation.x = Math.PI / 2; g.add(edge);
    var frame = new T.Mesh(new T.TorusGeometry(R + .07, .085, 8, 48),
      new T.MeshStandardMaterial({ color: 0x9aa6b2, roughness: .3, metalness: .85, envMapIntensity: 1.2 }));
    frame.rotation.x = Math.PI / 2; g.add(frame);
    /* 镜面反光：斜椭圆柔光（Sprite 始终朝相机），玻璃才有「反光」而不是一片灰雾 */
    var hc = document.createElement('canvas'); hc.width = hc.height = 128;
    var hx = hc.getContext('2d');
    var hg = hx.createRadialGradient(56, 58, 3, 64, 64, 60);
    hg.addColorStop(0, 'rgba(255,255,255,.9)');
    hg.addColorStop(.4, 'rgba(232,246,255,.38)');
    hg.addColorStop(1, 'rgba(220,240,255,0)');
    hx.fillStyle = hg; hx.fillRect(0, 0, 128, 128);
    var hl = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(hc),
      transparent: true, opacity: .42, depthWrite: false, blending: T.AdditiveBlending }));
    hl.scale.set(R * .95, R * .52, 1);
    hl.renderOrder = 3;
    g.add(hl);
    g.userData.lensBody = lens;
    g.userData.rim = frame;
    g.userData.setFocalHint = function () {};
    return g;
  }

  /* ══ 灵敏电流计（检流计）══════════════════════════════ */
  function galvanometer(opts) {
    opts = opts || {};

      x.fillStyle = '#f3faf5'; x.beginPath(); x.arc(256, 256, 240, 0, 6.283); x.fill();
      x.strokeStyle = '#222'; x.lineWidth = 6; x.beginPath(); x.arc(256, 256, 232, 0, 6.283); x.stroke();
      x.fillStyle = '#0a4d2f'; x.textAlign = 'center'; x.textBaseline = 'middle';

        x.beginPath(); x.moveTo(256 + Math.cos(a) * r1, 256 + Math.sin(a) * r1);
        x.lineTo(256 + Math.cos(a) * r2, 256 + Math.sin(a) * r2); x.stroke();
      }

      x.font = 'bold 28px Arial,sans-serif'; x.fillText('μA', 256, 330);
    });
    var face = new T.Mesh(new T.CircleGeometry(2.0, 40), new T.MeshBasicMaterial({ map: tex }));
    face.position.z = D / 2 + .02; g.add(face);
    /* 指针是 face 的子对象，z 必须写局部坐标：旧值 D/2+.05 让针浮在表盘前 1.35 */
    var needle = new T.Mesh(new T.BoxGeometry(.10, 1.62, .04), new T.MeshBasicMaterial({ color: 0xc0392b }));
    needle.geometry.translate(0, -.81, 0); needle.position.z = .02; face.add(needle);
    var pivot = new T.Mesh(new T.CircleGeometry(.09, 16), new T.MeshBasicMaterial({ color: 0x222 }));

    };

  }

  /* ══ 螺线管 ═══════════════════════════════════════════ */
  function solenoid(opts) {
    opts = opts || {};
    var MK = M(), g = new T.Group();
    var L = opts.len || 12, R = 1.8;

      var pts = [], n = 60;

        var t = i / n, a = t * L / (R * .55) * Math.PI * 2;
        pts.push(new T.Vector3((t - .5) * L, Math.cos(a) * (R - .1), Math.sin(a) * (R - .1)));
      }
      return new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), n, .14, 8, false),
        cmat(0xb87333, .35, .9));
    })();
    g.add(coil);
    [-1, 1].forEach(function (s) {
      var lead = new T.Mesh(new T.CylinderGeometry(.18, .18, 4, 8), cmat(0xb87333, .35, .9));
      lead.rotation.z = Math.PI / 2; lead.position.set(s * (L / 2 + 2), 0, 0); g.add(lead);
    });
    return g;
  }

  /* ══ 蹄形磁铁 ═════════════════════════════════════════ */
  function horseshoeMagnet(opts) {
