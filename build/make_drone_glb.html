<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>工业级四旋翼无人机 · 外观件 GLB 生成器</title></head>
<body>
<!--
  格物实验室 · 职业教育线 · 工业级四旋翼外观件 .glb 生成器
  ------------------------------------------------------------------
  参照 DJI Matrice 300 RTK 级真机比例（1 单位 = 2 cm）：
    对角轴距 895 mm → 44.75；展开 810×670×430 mm；含双 TB60 电池 6.3 kg。
    四电机 X 型对置，上置碳纤维锥管机臂，下置三轴云台，双电池后上置。

  分工（混合管线）：
    · 本 GLB = 外观/结构件：注塑上下壳、碳管机臂、外转子无刷电机、
      折叠桨、起落架、三轴云台、镜头筒、智能电池、RTK 天线、避障窗。
      每个可拆总成是独立命名 Group，课件里按名字升级 PBR 并做拆解。
    · 课件里程序化生成 = 飞控板/电调×4/分电板/GPS/线束/减震球等内部件。

  关键约定：
    1. 机身中心为原点，机头朝 -X；脚垫底端 y = -11.2，
       课件里 drone.position.y = 11.4 让脚垫落在工位台上。
    2. 层级：ARM_i(铰链点) → MOTOR_i → PROP_i，折叠机臂时电机与桨跟随，
       桨叶自转与拆解仍可独立控制。
    3. GLB 只带纯色底材（含少量 emissive 灯件），课件按节点名前缀
       分配碳纤维斜纹 / 注塑颗粒 / 阳极氧化铝拉丝 / 玻璃 / 橡胶等 PBR。
    4. 所有可见小件在位：螺丝沉孔、卡扣、分型线、格栅、状态灯、桨根铰链。
-->
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFExporter.js"></script>
<script>
(function () {
  'use strict';
  var T = window.THREE;
  var PI = Math.PI, TAU = PI * 2;
  var ROOT = new T.Group(); ROOT.name = 'DRONE_SHELL';
  window.__GLB_NODES = [];
  window.__GLB_DONE = false;
  window.__GLB_ERR = '';

  /* ── 真机比例常数 ── */
  var WB = 44.75;                 // 对角轴距
  var MX = WB / (2 * Math.SQRT2), MZ = MX;   // 15.82
  var ARM_Y = 4.2;                // 电机座相对机身中心高度
  var PROP_R = 12.8;              // 桨半径（21 inch 级）
  var BODY_L = 24, BODY_W = 15, BODY_H = 7;

  function M(hex, metal, rough, emi) {
    var o = { color: hex, metalness: metal, roughness: rough, side: T.DoubleSide };
    if (emi) { o.emissive = emi; o.emissiveIntensity = 1.0; }
    return new T.MeshStandardMaterial(o);
  }
  var MATS = {
    shell:   M(0x8d949c, .18, .62),   // 注塑磨砂灰（课件换颗粒 PBR）
    shellDk: M(0x4c535c, .22, .70),   // 深色注塑 / 分型线腰带
    carbon:  M(0x2b3138, .35, .48),   // 碳纤维管
    prop:    M(0x1e2329, .22, .72),   // 桨叶：哑光深色，别用高光清漆
    alu:     M(0x9aa3ad, .88, .32),   // 阳极氧化铝（电机壳/铰链/底板）
    aluDk:   M(0x5b646e, .85, .42),   // 深色铝
    copper:  M(0xb5743c, .82, .38),   // 定子绕组铜线
    dark:    M(0x252a30, .30, .66),   // 电池壳 / 桨毂 / 扎带
    rubber:  M(0x1b1f23, .05, .92),   // 减震球 / 脚垫
    glass:   M(0x2b3a45, .55, .12),   // 镜头 / 传感器窗
    lens:    M(0x18242e, .40, .08),   // 镜片深镀膜
    screw:   M(0xb9c1c9, .92, .26),   // 螺丝
    ledG:    M(0x2f7a4a, .10, .50, 0x31ff86),
    ledR:    M(0x7a2f2f, .10, .50, 0xff4438),
    ledW:    M(0x8a8f92, .10, .50, 0xdfefff),
    label:   M(0xc9ced4, .05, .80)    // 铭牌
  };
  /* 材质名写进 glTF，课件按 material.name 升级 PBR（比色号可靠：
     GLTFExporter/Loader 会做线性↔sRGB 转换，getHex() 会漂移）。 */
  Object.keys(MATS).forEach(function (k) { MATS[k].name = 'DRONE_' + k; });

  /* ── 通用几何工具 ──
     同尺寸小件共享同一份 BufferGeometry：GLTFExporter 按 geometry.uuid 缓存，
     导出时只写一份 accessor/bufferView，否则几百个独立倒角盒会把 GLB 撑到数 MB。 */
  var GEO = {};
  function cached(key, make) { if (!GEO[key]) GEO[key] = make(); return GEO[key]; }
  function rboxGeo(w, h, d, r) {
    return cached('r' + [w, h, d, r].join('_'), function () {
      /* 切角八边形轮廓 + bevel 倒角：圆角靠 bevel，不需要曲线细分顶点 */
      var s = new T.Shape(), hw = w / 2, hd = d / 2;
      s.moveTo(-hw + r, -hd); s.lineTo(hw - r, -hd); s.lineTo(hw, -hd + r);
      s.lineTo(hw, hd - r); s.lineTo(hw - r, hd); s.lineTo(-hw + r, hd);
      s.lineTo(-hw, hd - r); s.lineTo(-hw, -hd + r); s.closePath();
      var g = new T.ExtrudeGeometry(s, {
        depth: Math.max(.02, h - 2 * r), bevelEnabled: true,
        bevelSize: r, bevelThickness: r, bevelSegments: 1,
        curveSegments: 1, steps: 1
      });
      g.rotateX(-PI / 2);
      g.translate(0, h / 2 - r, 0);
      return g;
    });
  }
  function rbox(w, h, d, r, mat) {
    var m = new T.Mesh(rboxGeo(w, h, d, r), mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  /* 圆角多边形俯视轮廓 → 水平板（用于壳体、顶盖、法兰） */
  function slab(points, thick, mat, bevel) {
    var b = bevel === undefined ? .28 : bevel;
    var key = 's' + thick + '_' + b + '_' + points.map(function (p) { return p[0] + ':' + p[1]; }).join('|');
    var g = cached(key, function () {
      var s = new T.Shape(), i;
      s.moveTo(points[0][0], points[0][1]);
      for (i = 1; i < points.length; i++) s.lineTo(points[i][0], points[i][1]);
      s.closePath();
      var gg = new T.ExtrudeGeometry(s, {
        depth: Math.max(.02, thick - 2 * b), bevelEnabled: true, bevelSize: b,
        bevelThickness: b, bevelSegments: 1, curveSegments: 2, steps: 1
      });
      gg.rotateX(-PI / 2);
      gg.translate(0, -thick / 2 + b, 0);
      return gg;
    });
    var m = new T.Mesh(g, mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  /* 切角六边形俯视轮廓（真机机身不是方盒） */
  function hull(w, d, cut) {
    var x = w / 2, z = d / 2, c = cut;
    return [[-x + c, -z], [x - c, -z], [x, -z + c], [x, z - c],
            [x - c, z], [-x + c, z], [-x, z - c], [-x, -z + c]];
  }
  function cyl(rt, rb, h, mat, seg) {
    var sg = seg || 20;
    var g = cached('c' + [rt, rb, h, sg].join('_'), function () {
      return new T.CylinderGeometry(rt, rb, h, sg);
    });
    var m = new T.Mesh(g, mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function torus(r, tb, mat, seg) {
    var sg = seg || 28;
    var g = cached('t' + [r, tb, sg].join('_'), function () {
      return new T.TorusGeometry(r, tb, 8, sg);
    });
    var m = new T.Mesh(g, mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function sphere(r, mat, seg) {
    var sg = seg || 18;
    var g = cached('p' + [r, sg].join('_'), function () {
      return new T.SphereGeometry(r, sg, sg / 2);
    });
    var m = new T.Mesh(g, mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  /* 两点之间的锥管：用单位长度几何 + scale.y 复用，避免每段机臂单独一份网格 */
  var UNIT_TUBE = {};
  function tube(a, b, rt, rb, mat, seg) {
    var sg = seg || 16, key = [rt, rb, sg].join('_');
    if (!UNIT_TUBE[key]) UNIT_TUBE[key] = new T.CylinderGeometry(rt, rb, 1, sg, 1, false);
    var A = new T.Vector3(a[0], a[1], a[2]), B = new T.Vector3(b[0], b[1], b[2]);
    var d = new T.Vector3().subVectors(B, A);
    var m = new T.Mesh(UNIT_TUBE[key], mat);
    m.scale.y = d.length();
    m.position.copy(A).add(B).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.clone().normalize());
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function named(name, obj) {
    obj.name = name; window.__GLB_NODES.push(name); return obj;
  }

  /* ═════════════════════ ① 中心机身 ═════════════════════ */
  var H = hull(BODY_L, BODY_W, 3.2);
  var H2 = hull(BODY_L - 1.0, BODY_W - .8, 3.0);

  /* 下壳 / 铝合金承载底板：真机是压铸底板 + 塑料下壳 */
  (function () {
    var g = named('SHELL_BOTTOM', new T.Group());
    var base = slab(H, 1.5, MATS.aluDk, .22); base.position.y = -3.45; g.add(base);
    var lower = slab(H2, 2.6, MATS.shellDk, .30); lower.position.y = -1.9; g.add(lower);
    /* 底板散热鳍片（真机底部有散热铝鳍） */
    for (var i = -4; i <= 4; i++) {
      var fin = rbox(15, .34, .34, .10, MATS.aluDk);
      fin.position.set(0, -4.28, i * 1.35); g.add(fin);
    }
    /* 前部 FPV 摄像头窗 */
    var fpv = rbox(.5, 1.1, 2.2, .16, MATS.glass);
    fpv.position.set(-11.7, -1.6, 0); g.add(fpv);
    ROOT.add(g);
  })();

  /* 中壳（主承力壳）+ 分型线腰带 */
  (function () {
    var g = named('SHELL_MID', new T.Group());
    var mid = slab(H2, 3.1, MATS.shell, .34); mid.position.y = .25; g.add(mid);
    /* 分型线：上壳与中壳之间的一圈深色腰带，近景能读出"这是两件拼的" */
    var belt = slab(hull(BODY_L - .75, BODY_W - .6, 2.9), .34, MATS.shellDk, .05);
    belt.position.y = 1.86; g.add(belt);
    /* 侧面散热格栅：凹槽用深色细条 + 亮边表达 */
    [-1, 1].forEach(function (s) {
      for (var i = 0; i < 6; i++) {
        var slot = rbox(.30, .22, 3.4, .06, MATS.dark);
        slot.position.set(2.0 + i * 1.05, .5, s * 7.2); g.add(slot);
      }
    });
    /* 侧面接口盖板 + 卡扣 */
    [-1, 1].forEach(function (s) {
      var cap = rbox(3.4, 1.5, .30, .14, MATS.shellDk);
      cap.position.set(7.6, -.3, s * 7.35); g.add(cap);
      var latch = rbox(.9, .42, .22, .08, MATS.alu);
      latch.position.set(7.6, -.3, s * 7.62); g.add(latch);
    });
    ROOT.add(g);
  })();

  /* 上壳（可整体抬起的顶盖）：顶面斜度、格栅、螺丝沉孔、状态灯。
     后部必须挖出两个电池仓开口 —— 真机电池是插进机身里的，
     否则两块方盒压在完整平板上，一眼就是"摆上去的"。 */
  (function () {
    var g = named('SHELL_TOP', new T.Group());
    (function () {
      var p = hull(BODY_L - 1.4, BODY_W - 1.1, 2.9);
      var s = new T.Shape(), i;
      s.moveTo(p[0][0], p[0][1]);
      for (i = 1; i < p.length; i++) s.lineTo(p[i][0], p[i][1]);
      s.closePath();
      [-1, 1].forEach(function (z) {
        var h = new T.Path();
        h.moveTo(-.6, z * 3.35 - 3.05); h.lineTo(9.2, z * 3.35 - 3.05);
        h.lineTo(9.2, z * 3.35 + 3.05); h.lineTo(-.6, z * 3.35 + 3.05);
        h.closePath(); s.holes.push(h);
      });
      var b = .32, gg = new T.ExtrudeGeometry(s, {
        depth: 1.55 - 2 * b, bevelEnabled: true, bevelSize: b,
        bevelThickness: b, bevelSegments: 1, curveSegments: 2, steps: 1
      });
      gg.rotateX(-PI / 2); gg.translate(0, -1.55 / 2 + b, 0);
      var m = new T.Mesh(gg, MATS.shell);
      m.position.y = 2.80; m.castShadow = true; m.receiveShadow = true;
      g.add(m);
    })();
    /* 顶面中央隆起（GPS/IMU 舱盖，真机有一块凸台） */
    var hump = slab(hull(9.5, 8.2, 1.8), .9, MATS.shellDk, .24);
    hump.position.set(-1.2, 3.85, 0); g.add(hump);
    /* 顶部纵向散热格栅 */
    for (var i = 0; i < 7; i++) {
      var gr = rbox(.34, .16, 5.0, .06, MATS.dark);
      gr.position.set(5.2 + i * .82, 3.62, 0); g.add(gr);
    }
    /* 顶面两条注塑加强筋（只在前半部，避开电池仓开口） + 前缘导角条 */
    [-1, 1].forEach(function (s) {
      var ribTop = rbox(7.0, .22, .30, .08, MATS.shellDk);
      ribTop.position.set(-6.5, 3.62, s * 5.6); g.add(ribTop);
    });
    var nose = rbox(.55, .34, 8.0, .12, MATS.shellDk);
    nose.position.set(-10.2, 3.52, 0); g.add(nose);
    /* 螺丝沉孔：一圈真实沉头孔（深色孔 + 亮头） */
    var screws = named('SCREWS', new T.Group());
    [[-9.2, -5.4], [-9.2, 5.4], [9.2, -5.4], [9.2, 5.4],
     [-3.0, -6.0], [4.4, -6.0], [-3.0, 6.0], [4.4, 6.0]].forEach(function (p, k) {
      var seat = cyl(.42, .42, .10, MATS.shellDk, 14);
      seat.position.set(p[0], 3.60, p[1]); screws.add(seat);
      var head = cyl(.26, .26, .13, MATS.screw, 12);
      head.position.set(p[0], 3.69, p[1]); screws.add(head);
      var slot = rbox(.34, .05, .07, .02, MATS.dark);
      slot.position.set(p[0], 3.77, p[1]); screws.add(slot);
    });
    g.add(screws);
    /* 状态指示灯（臂灯在机臂末端，这里放机身前后航行灯） */
    var leds = named('LEDS', new T.Group());
    var fl = rbox(.7, .36, 1.5, .12, MATS.ledR); fl.position.set(-10.9, 2.7, -4.0); leds.add(fl);
    var fr = rbox(.7, .36, 1.5, .12, MATS.ledG); fr.position.set(-10.9, 2.7, 4.0); leds.add(fr);
    var bl = rbox(.7, .36, 1.5, .12, MATS.ledW); bl.position.set(10.9, 2.7, -4.0); leds.add(bl);
    var br = rbox(.7, .36, 1.5, .12, MATS.ledW); br.position.set(10.9, 2.7, 4.0); leds.add(br);
    g.add(leds);
    /* 铭牌 */
    var plate = rbox(4.2, .08, 1.5, .06, MATS.label);
    plate.position.set(-3.0, 3.62, 0); g.add(plate);
    ROOT.add(g);
  })();

  /* 六向避障传感器窗（前/后/左/右/上/下） */
  (function () {
    var g = named('SENSORS', new T.Group());
    function sensor(x, y, z, sx, sy, sz) {
      var frame = rbox(sx, sy, sz, .16, MATS.dark);
      frame.position.set(x, y, z); g.add(frame);
      var lens = rbox(sx * .62, sy * .62, sz * .34, .10, MATS.glass);
      lens.position.set(x, y, z + (z >= 0 ? sz * .35 : -sz * .35)); g.add(lens);
    }
    sensor(-11.6, .4, -3.1, .6, 1.5, 2.4);
    sensor(-11.6, .4,  3.1, .6, 1.5, 2.4);
    sensor( 11.6, .4, -3.1, .6, 1.5, 2.4);
    sensor( 11.6, .4,  3.1, .6, 1.5, 2.4);
    sensor(-6.0, 3.1, 0, 2.0, .5, 2.4);
    sensor( 6.0, -3.6, 0, 2.0, .5, 2.4);
    ROOT.add(g);
  })();

  /* ═════════════════════ ② 机臂 + 电机 + 折叠桨 ═════════════════════ */
  /* 桨叶：带展向扭转、桨尖后掠、翼型厚度的真实折叠桨 */
  function propBladeGeo(r0, r1, chord0, chord1, tw0, tw1, sweep, thick) {
    var NR = 14, NC = 10, P = (NR + 1) * (NC + 1), pos = [], idx = [], s, i, j;
    function off(s, i, j) { return s * P + i * (NC + 1) + j; }
    for (s = 0; s < 2; s++) {
      for (i = 0; i <= NR; i++) {
        var t = i / NR, r = r0 + (r1 - r0) * t;
        var chord = chord0 + (chord1 - chord0) * t;
        var tw = (tw0 + (tw1 - tw0) * t) * PI / 180;
        var sw = sweep * t * t;
        var ct = Math.cos(tw), st = Math.sin(tw);
        for (j = 0; j <= NC; j++) {
          var c = j / NC;
          var yt = 5 * thick * (0.2969 * Math.sqrt(c) - 0.1260 * c
                   - 0.3516 * c * c + 0.2843 * c * c * c - 0.1036 * c * c * c * c);
          var th = yt * chord * (s === 0 ? 1 : -1);
          var cam = .06 * Math.sin(PI * c) * chord;
          var zc = th + cam, xc = (c - .5) * chord;
          /* 桨叶沿 +X 展向、水平铺在 XZ 平面：厚度在 Y、弦向在 Z。
             扭转是绕展向轴(X)旋转弦面，所以 Y/Z 用 ct/st 混合；
             写反了桨叶会竖着立在电机上，斜上方看只剩一条线。 */
          var thickY = xc * st + zc * ct;
          var chordZ = xc * ct - zc * st;
          pos.push(r + sw, thickY, chordZ);
        }
      }
    }
    for (s = 0; s < 2; s++) for (i = 0; i < NR; i++) for (j = 0; j < NC; j++) {
      var A = off(s, i, j), B = off(s, i, j + 1), C = off(s, i + 1, j), D = off(s, i + 1, j + 1);
      if (s === 0) idx.push(A, B, D, A, D, C); else idx.push(A, D, B, A, C, D);
    }
    for (i = 0; i < NR; i++) [0, NC].forEach(function (jj) {
      var u0 = off(0, i, jj), u1 = off(0, i + 1, jj), l0 = off(1, i, jj), l1 = off(1, i + 1, jj);
      idx.push(u0, l0, l1, u0, l1, u1);
    });
    [0, NR].forEach(function (ii) { for (j = 0; j < NC; j++) {
      var a = off(0, ii, j), b = off(0, ii, j + 1), c = off(1, ii, j), d = off(1, ii, j + 1);
      idx.push(a, b, d, a, d, c);
    } });
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();
    return g;
  }
  /* 21 inch 桨：根弦约 3.1、桨尖收至 1.5（真机弦长≈半径的 1/5），
     过窄会读成针状细条。厚度也按真实桨型给到 .11。 */
  var bladeGeoShared = propBladeGeo(1.5, PROP_R, 3.10, 1.45, 28, 8, 1.15, .115);

  /* 外转子无刷电机：底座 + 定子绕组 + bell 外转子 + 散热孔 + 桨座 + 三相线 */
  function buildMotor(name, cx, cz) {
    var g = named(name, new T.Group());
    g.position.set(cx, ARM_Y, cz);
    /* 电机安装座（与机臂末端抱箍相连） */
    var mount = cyl(2.1, 2.35, .55, MATS.alu, 28); mount.position.y = -.15; g.add(mount);
    var mountRing = torus(2.12, .16, MATS.aluDk, 30);
    mountRing.rotation.x = PI / 2; mountRing.position.y = .16; g.add(mountRing);
    /* 定子铁芯 + 铜绕组（从 bell 下沿能看到） */
    var stator = cyl(1.55, 1.55, .70, MATS.aluDk, 24); stator.position.y = .72; g.add(stator);
    for (var k = 0; k < 12; k++) {
      var a = k / 12 * TAU;
      var coil = cyl(.30, .30, .62, MATS.copper, 10);
      coil.position.set(Math.cos(a) * 1.52, .72, Math.sin(a) * 1.52);
      g.add(coil);
    }
    /* 外转子 bell：倒扣圆筒 + 顶盖 + 斜散热槽 */
    var bell = new T.Mesh(new T.CylinderGeometry(2.02, 2.02, 1.75, 32, 1, true), MATS.alu);
    bell.position.y = 1.85; bell.castShadow = true; g.add(bell);
    var bellTop = cyl(2.02, 2.02, .30, MATS.alu, 32); bellTop.position.y = 2.78; g.add(bellTop);
    for (k = 0; k < 16; k++) {
      var b = k / 16 * TAU;
      var slot = rbox(.22, .9, .42, .08, MATS.aluDk);
      slot.position.set(Math.cos(b) * 2.02, 1.92, Math.sin(b) * 2.02);
      slot.rotation.y = -b; g.add(slot);
    }
    /* 桨座 / 桨毂 */
    var hub = cyl(.95, .95, .55, MATS.dark, 24); hub.position.y = 3.16; g.add(hub);
    var hubNut = cyl(.55, .55, .30, MATS.screw, 6); hubNut.position.y = 3.52; g.add(hubNut);
    /* 三相硅胶线（从底座引到机臂） */
    [-.42, 0, .42].forEach(function (dz, k2) {
      var curve = new T.CatmullRomCurve3([
        new T.Vector3(1.4, .1, dz), new T.Vector3(2.4, -.1, dz * 1.4),
        new T.Vector3(3.6, -.3, dz * 1.8)
      ]);
      var w = new T.Mesh(new T.TubeGeometry(curve, 12, .13, 6, false), MATS.dark);
      w.castShadow = true; g.add(w);
    });
    return g;
  }
  function buildProp(name, cx, cz, tag) {
    var g = named(name, new T.Group());
    g.position.set(cx, ARM_Y + 3.42, cz);
    /* 四组桨不同初始相位；避开与机臂（约 ±45°）平行，
       否则其中一片桨正好顺着机臂，俯视时读成"单叶桨"。 */
    g.rotation.y = [1.05, -.95, .82, -1.12][tag % 4];
    /* 折叠桨根：两片桨共用一个桨毂 + 两个铰链销 */
    var hub = cyl(1.05, 1.05, .42, MATS.dark, 22); g.add(hub);
    var spinner = cyl(.62, .78, .46, MATS.alu, 20); spinner.position.y = .38; g.add(spinner);
    for (var k = 0; k < 2; k++) {
      var blade = new T.Mesh(bladeGeoShared, MATS.prop);
      blade.rotation.y = k * PI;
      blade.position.y = .10;
      blade.castShadow = true; blade.receiveShadow = true;
      g.add(blade);
      var hinge = cyl(.42, .42, .72, MATS.alu, 14);
      hinge.position.set(Math.cos(k * PI) * 1.55, .10, 0);
      g.add(hinge);
      var pin = cyl(.16, .16, .92, MATS.screw, 10);
      pin.position.set(Math.cos(k * PI) * 1.55, .10, 0);
      g.add(pin);
    }
    /* 桨尖警示色（真机桨尖常有白/黄标） */
    [0, 1].forEach(function (k) {
      var tip = rbox(1.1, .12, .72, .05, MATS.label);
      tip.position.set(Math.cos(k * PI) * (PROP_R - .7), .12, 0);
      tip.rotation.y = k * PI; g.add(tip);
    });
    /* 臂灯 */
    var armLed = rbox(.7, .5, 1.2, .16, (tag === 0 || tag === 3) ? MATS.ledR : MATS.ledG);
    armLed.position.set(0, -1.0, 0); g.add(armLed);
    return g;
  }

  /* 四组机臂：以铰链点为 Group 原点，折叠时 rotation.y 生效 */
  var ARMS = [
    { n: 'ARM_FL', s: [-1, -1], hx: -8.6, hz: -5.2 },
    { n: 'ARM_FR', s: [-1,  1], hx: -8.6, hz:  5.2 },
    { n: 'ARM_RL', s: [ 1, -1], hx:  8.6, hz: -5.2 },
    { n: 'ARM_RR', s: [ 1,  1], hx:  8.6, hz:  5.2 }
  ];
  ARMS.forEach(function (A, idx) {
    var mx = A.s[0] * MX, mz = A.s[1] * MZ;
    var g = named(A.n, new T.Group());
    g.position.set(A.hx, 1.35, A.hz);       /* 铰链点 */
    /* 折叠铰链：铸铝块 + 转轴 + 锁扣 */
    var hinge = named('HINGE_' + idx, new T.Group());
    var block = rbox(3.0, 1.9, 2.6, .30, MATS.alu);
    block.position.set(0, 0, 0); hinge.add(block);
    var pin = cyl(.36, .36, 2.4, MATS.screw, 14);
    pin.rotation.x = PI / 2; pin.position.set(0, .2, 0); hinge.add(pin);
    var latch = rbox(1.1, .5, .5, .12, MATS.aluDk);
    latch.position.set(1.7, .9, 0); hinge.add(latch);
    g.add(hinge);
    /* 碳纤维锥管：从铰链点斜向上外伸到电机座 */
    var a = [0, .1, 0];
    var b = [mx - A.hx, ARM_Y - 1.35 - .35, mz - A.hz];
    g.add(tube(a, b, .78, 1.05, MATS.carbon, 20));
    /* 根部抱箍 + 末端抱箍 */
    var c1 = cyl(1.18, 1.18, .55, MATS.aluDk, 20);
    c1.position.set(a[0] * .15 + b[0] * .12, a[1] * .15 + b[1] * .12, a[2] * .15 + b[2] * .12);
    c1.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0),
      new T.Vector3(b[0], b[1], b[2]).normalize());
    g.add(c1);
    /* 走线管（三相线沿机臂内侧） */
    var wa = [a[0] + .3, a[1] - .55, a[2] + .3];
    var wb = [b[0] - .3, b[1] - .55, b[2] - .3];
    g.add(tube(wa, wb, .16, .16, MATS.dark, 8));
    /* 电机与桨作为机臂子节点，折叠时一起转 */
    var mo = buildMotor('MOTOR_' + idx, mx - A.hx, mz - A.hz);
    mo.position.set(mx - A.hx, ARM_Y - 1.35, mz - A.hz);
    g.add(mo);
    var pr = buildProp('PROP_' + idx, mx - A.hx, mz - A.hz, idx);
    pr.position.set(mx - A.hx, ARM_Y - 1.35 + 3.42, mz - A.hz);
    g.add(pr);
    ROOT.add(g);
  });

  /* ═════════════════════ ③ 起落架 ═════════════════════ */
  [-1, 1].forEach(function (s, k) {
    var g = named(k === 0 ? 'GEAR_L' : 'GEAR_R', new T.Group());
    /* 两根斜撑 + 横向滑橇 + 橡胶脚垫 */
    [-6.5, 6.5].forEach(function (x) {
      g.add(tube([x, -3.2, s * 4.6], [x * 1.12, -10.6, s * 9.2], .52, .66, MATS.carbon, 14));
      var joint = cyl(.72, .72, .50, MATS.aluDk, 16);
      joint.position.set(x, -3.2, s * 4.6); g.add(joint);
    });
    var skid = tube([-8.2, -10.9, s * 9.2], [8.2, -10.9, s * 9.2], .60, .60, MATS.carbon, 14);
    g.add(skid);
    [-6.6, 6.6].forEach(function (x) {
      var pad = rbox(2.0, .70, 1.9, .24, MATS.rubber);
      pad.position.set(x, -11.05, s * 9.2); g.add(pad);
    });
    /* 横向加强杆 */
    g.add(tube([-5.0, -6.6, s * 6.6], [5.0, -6.6, s * 6.6], .30, .30, MATS.aluDk, 10));
    ROOT.add(g);
  });

  /* ═════════════════════ ④ 下置三轴云台 + 相机 ═════════════════════ */
  (function () {
    var g = named('GIMBAL', new T.Group());
    g.position.set(-8.0, -4.6, 0);
    /* 减震板 + 4 个橡胶减震球 */
    var damper = slab(hull(6.4, 5.4, .9), .42, MATS.aluDk, .14);
    damper.position.y = 0; g.add(damper);
    [[-2.2, -1.8], [-2.2, 1.8], [2.2, -1.8], [2.2, 1.8]].forEach(function (p) {
      var ball = sphere(.52, MATS.rubber, 14);
      ball.position.set(p[0], -.62, p[1]); g.add(ball);
    });
    /* Yaw 轴 */
    var yawM = cyl(1.05, 1.05, .85, MATS.alu, 24); yawM.position.y = -1.35; g.add(yawM);
    var yawRing = torus(1.02, .10, MATS.aluDk, 26);
    yawRing.rotation.x = PI / 2; yawRing.position.y = -1.75; g.add(yawRing);
    /* Roll 臂（U 形） */
    var rollArm = rbox(1.0, 2.5, 5.6, .26, MATS.alu);
    rollArm.position.set(0, -2.75, 0); g.add(rollArm);
    [-1, 1].forEach(function (s) {
      var arm = rbox(1.1, 1.1, 1.0, .22, MATS.alu);
      arm.position.set(0, -2.3, s * 2.75); g.add(arm);
      var pm = cyl(.82, .82, .95, MATS.aluDk, 20);
      pm.rotation.x = PI / 2; pm.position.set(0, -3.35, s * 2.9); g.add(pm);
    });
    /* 相机本体（Zenmuse H20 级：方块机身 + 多镜头筒） */
    var cam = rbox(4.4, 3.1, 4.0, .42, MATS.dark);
    cam.position.set(0, -4.6, 0); g.add(cam);
    var camTop = rbox(3.8, .34, 3.4, .14, MATS.aluDk);
    camTop.position.set(0, -2.98, 0); g.add(camTop);
    /* 主镜头：镜筒 + 金属环 + 镀膜玻璃 + 光圈 */
    function lensUnit(x, z, r, len) {
      var grp = new T.Group(); grp.position.set(x, -4.6, z);
      var barrel = cyl(r, r, len, MATS.aluDk, 24);
      barrel.rotation.z = PI / 2; barrel.position.x = 2.2 + len / 2; grp.add(barrel);
      var ring = torus(r * .92, .10, MATS.alu, 26);
      ring.rotation.y = PI / 2; ring.position.x = 2.2 + len; grp.add(ring);
      var glass = cyl(r * .80, r * .80, .10, MATS.lens, 24);
      glass.rotation.z = PI / 2; glass.position.x = 2.22 + len; grp.add(glass);
      var inner = cyl(r * .62, r * .62, .06, MATS.glass, 24);
      inner.rotation.z = PI / 2; inner.position.x = 2.26 + len; grp.add(inner);
      return grp;
    }
    g.add(lensUnit(0, .95, 1.05, .85));
    g.add(lensUnit(0, -1.15, .62, .55));
    g.add(lensUnit(0, -1.95, .42, .40));
    /* 云台状态灯 */
    var st = rbox(.4, .3, .8, .10, MATS.ledG);
    st.position.set(-2.2, -4.2, 0); g.add(st);
    ROOT.add(g);
  })();

  /* ═════════════════════ ⑤ 双 TB60 智能电池 ═════════════════════ */
  /* 电池仓：先做嵌入式仓体 + 导轨，电池插在里面，
     否则两块方盒直接摆在顶盖上，一眼就是"贴上去的"。 */
  (function () {
    var bay = named('BAT_BAY', new T.Group());
    var floor = slab(hull(11.0, 13.4, 1.6), .55, MATS.shellDk, .18);
    floor.position.set(4.2, 1.95, 0); bay.add(floor);
    [-1, 1].forEach(function (s) {
      var rail = rbox(10.4, .52, .42, .12, MATS.aluDk);
      rail.position.set(4.2, 2.30, s * 6.7); bay.add(rail);
      var wall = rbox(.45, 2.4, 13.0, .14, MATS.shellDk);
      wall.position.set(9.6, 2.9, 0); bay.add(wall);
    });
    var midRail = rbox(10.4, .50, .40, .10, MATS.aluDk);
    midRail.position.set(4.2, 2.30, 0); bay.add(midRail);
    ROOT.add(bay);
  })();
  [-1, 1].forEach(function (s, k) {
    var g = named(k === 0 ? 'BAT_L' : 'BAT_R', new T.Group());
    /* 插进仓体：电池下部沉入上壳开口内，只有上盖与提手露出 */
    g.position.set(4.2, 3.55, s * 3.35);
    var body = rbox(9.4, 3.0, 5.9, .46, MATS.dark); g.add(body);
    var cap = rbox(9.2, .48, 5.7, .22, MATS.shellDk); cap.position.y = 1.62; g.add(cap);
    for (var i = -3; i <= 3; i++) {
      var rib = rbox(.26, 2.4, 5.96, .09, MATS.shellDk);
      rib.position.x = i * 1.25; g.add(rib);
    }
    var handle = rbox(2.6, .42, 1.4, .18, MATS.aluDk);
    handle.position.set(-3.1, 1.98, 0); g.add(handle);
    var latch = rbox(1.2, .62, 2.2, .16, MATS.alu);
    latch.position.set(4.35, 1.0, 0); g.add(latch);
    for (i = 0; i < 4; i++) {
      var led = rbox(.52, .26, .52, .09, MATS.ledG);
      led.position.set(1.2 + i * .92, 1.95, 2.0); g.add(led);
    }
    var btn = cyl(.40, .40, .16, MATS.screw, 16);
    btn.position.set(-1.4, 1.95, 0); g.add(btn);
    for (i = 0; i < 5; i++) {
      var ct = rbox(.10, .50, .40, .03, MATS.copper);
      ct.position.set(4.72, -.5, -1.6 + i * .8); g.add(ct);
    }
    var lb = rbox(3.0, .06, 1.4, .04, MATS.label);
    lb.position.set(-.4, 1.92, -1.6); g.add(lb);
    ROOT.add(g);
  });

  /* ═════════════════════ ⑥ RTK / GNSS 天线 ═════════════════════ */
  [-1, 1].forEach(function (s, k) {
    var g = named(k === 0 ? 'RTK_L' : 'RTK_R', new T.Group());
    g.position.set(1.0, 4.4, s * 5.0);
    var stem = cyl(.75, .95, 1.25, MATS.aluDk, 20); g.add(stem);
    var base = cyl(1.35, 1.35, .32, MATS.alu, 24); base.position.y = .72; g.add(base);
    var dome = new T.Mesh(new T.SphereGeometry(1.55, 24, 12, 0, TAU, 0, PI / 2), MATS.shell);
    dome.position.y = .88; dome.castShadow = true; g.add(dome);
    var ring = torus(1.52, .10, MATS.aluDk, 28);
    ring.rotation.x = PI / 2; ring.position.y = .90; g.add(ring);
    ROOT.add(g);
  });

  /* ── 导出前：把材质键编进 mesh.name ──
     GLTFLoader 加载后 material.name 会变成空字符串、色号也会因 sRGB 转换漂移，
     但 node/mesh 的 name 会完整保留。所以把材质键写进 mesh.name 前缀：
       "MAT_carbon__<原名>"  →  课件按前缀精确升级，零猜测。 */
  ROOT.traverse(function (o) {
    if (!o.isMesh || !o.material || !o.material.name) return;
    var key = o.material.name.replace('DRONE_', '');
    o.name = 'MAT_' + key + '__' + (o.name || 'm');
  });

  /* ── 导出 binary GLB → base64 ── */
  function ab2b64(buf) {
    var bytes = new Uint8Array(buf), n = bytes.length, out = '', CH = 0x8000, i;
    for (i = 0; i < n; i += CH)
      out += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CH, n)));
    return btoa(out);
  }
  try {
    var exp = new T.GLTFExporter();
    exp.parse(ROOT, function (result) {
      if (!(result instanceof ArrayBuffer)) {
        window.__GLB_ERR = 'exporter did not return ArrayBuffer'; return;
      }
      window.__GLB_B64 = ab2b64(result);
      window.__GLB_BYTES = result.byteLength;
      window.__GLB_DONE = true;
    }, function (e) { window.__GLB_ERR = String(e && (e.stack || e.message || e)); },
      { binary: true, onlyVisible: false, trs: false });
  } catch (e) { window.__GLB_ERR = String(e && (e.stack || e)); }
})();
</script>
</body>
</html>
