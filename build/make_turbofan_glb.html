<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>涡扇发动机 · 外观件 GLB 生成器</title></head>
<body>
<!--
  格物实验室 · 职业教育线 · 涡扇发动机外观件 .glb 生成器
  ------------------------------------------------------------------
  这一页只做一件事：用 three r147 UMD + GLTFExporter 把「程序化精模」
  导成 binary GLB，交给 build/make_turbofan_glb.js 落盘为
  build/assets/turbofan-shell.glb。

  分工（混合管线）：
    · 本 GLB = 外观曲面件（短舱/机匣/整流锥/尾喷/挂架/宽弦风扇叶片）
      —— 流线曲面、带壁厚、带翼型扭转，CAD 观感靠它。
    · 课件里程序化生成 = 内部核心机（压气机级/燃烧室/涡轮级/双轴/气流）
      —— 要按教学步骤拆分、要参数化运动，程序化最合适。

  关键约定：
    1. 所有回转体绕 X 轴；+z 半面是「剖掉」的一侧，半剖件保留 z<=0。
    2. 每个壳体同时导出 *_FULL（整圈）与 *_HALF（半圈 + 剖切断面 CAP），
       课件按步骤切换 visible，绝不用全透明壳冒充剖切。
    3. 剖切断面是真实「材料截面」：用闭合 profile 在 z=0 平面挤出薄板，
       上下各一块，配亮金属材质 —— 这就是机加工亮边。
    4. 法线按 profile 解析计算，不用 computeVertexNormals 猜面法线。
    5. mesh.name 带后缀，课件按名字前缀分配 PBR 材质（GLB 只带纯色底材）。
-->
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFExporter.js"></script>
<script>
(function () {
  'use strict';
  var T = window.THREE;
  var PI = Math.PI, TAU = PI * 2;
  var ROOT = new T.Group(); ROOT.name = 'TURBOFAN_SHELL';
  window.__GLB_NODES = [];
  window.__GLB_DONE = false;
  window.__GLB_ERR = '';

  /* ── 材质：GLB 里只放纯色底材，课件加载后按节点名升级为 PBR ── */
  function M(hex, metal, rough) {
    return new T.MeshStandardMaterial({
      color: hex, metalness: metal, roughness: rough, side: T.DoubleSide
    });
  }
  var MATS = {
    nacelle:  M(0xe3e9ef, .28, .42),   // 短舱外蒙皮：白涂装
    core:     M(0x9aa4ae, .78, .38),   // 核心机机匣：金属灰
    fancase:  M(0x8a9099, .85, .32),   // 风扇机匣：亮金属
    cutFace:  M(0xd8e2ec, .90, .22),   // 剖切断面：机加工亮边
    spinner:  M(0xc0c6cc, .86, .28),   // 整流锥：钛合金
    blade:    M(0xbcc5cf, .88, .26),   // 风扇叶片：钛合金
    hot:      M(0x4a5058, .70, .48),   // 尾喷/排气锥：耐热合金
    pylon:    M(0x7f8b98, .55, .48),   // 挂架
    dark:     M(0x39414a, .70, .50),   // 缝/螺栓/深色结构件
    lip:      M(0xd2dae2, .92, .20)    // 进气唇口亮圈
  };

  /* ── 绕 X 轴的回转体（解析法线 + 可半剖） ──────────────────────
     profile = [[x, r], ...] 闭合轮廓：外壁从前往后，内壁从后往回。
     顶点：y = r·cos(a), z = r·sin(a)；a∈[PI,2PI] → z<=0（保留侧）。
     解析法线 n = (-dr, dx·cos a, dx·sin a) / |(dx,dr)|，
     内壁因 dx<0 自动翻转，剖开后内外壁明暗关系正确。            */
  function latheX(profile, phiStart, phiLen, seg) {
    var n = profile.length, rows = seg + 1;
    var pos = [], nrm = [], uv = [], idx = [], i, j;
    for (i = 0; i < rows; i++) {
      var a = phiStart + phiLen * (i / seg), ca = Math.cos(a), sa = Math.sin(a);
      for (j = 0; j < n; j++) {
        var x = profile[j][0], r = profile[j][1];
        pos.push(x, r * ca, r * sa);
        var pPrev = profile[(j - 1 + n) % n], pNext = profile[(j + 1) % n];
        var dx = pNext[0] - pPrev[0], dr = pNext[1] - pPrev[1];
        var len = Math.sqrt(dx * dx + dr * dr) || 1;
        nrm.push(-dr / len, (dx / len) * ca, (dx / len) * sa);
        uv.push(i / seg, j / n);
      }
    }
    for (i = 0; i < seg; i++) {
      for (j = 0; j < n; j++) {
        var j2 = (j + 1) % n;
        var A = i * n + j, B = i * n + j2, C = (i + 1) * n + j, D = (i + 1) * n + j2;
        idx.push(A, B, D, A, D, C);
      }
    }
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new T.Float32BufferAttribute(nrm, 3));
    g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeBoundingSphere();
    return g;
  }

  /* ── 剖切断面：闭合 profile 在 z=0 平面挤出的真实材料截面 ── */
  function capGeo(profile, depth) {
    var s = new T.Shape(), i;
    s.moveTo(profile[0][0], profile[0][1]);
    for (i = 1; i < profile.length; i++) s.lineTo(profile[i][0], profile[i][1]);
    s.closePath();
    var d = depth || .10;
    var g = new T.ExtrudeGeometry(s, { depth: d, bevelEnabled: false, curveSegments: 2, steps: 1 });
    g.translate(0, 0, -d / 2);
    return g;
  }

  /* 一对节点：FULL 整圈 / HALF 半圈 + 上下两块剖切断面 */
  function shellPair(name, profile, matKey, seg) {
    var SEG = seg || 84;
    var mat = MATS[matKey];
    var gFull = new T.Group(); gFull.name = name + '_FULL';
    var gHalf = new T.Group(); gHalf.name = name + '_HALF';

    var f = new T.Mesh(latheX(profile, 0, TAU, SEG), mat);
    f.name = name + '_FULL__shell'; f.castShadow = true; f.receiveShadow = true;
    gFull.add(f);

    var h = new T.Mesh(latheX(profile, PI, PI, SEG), mat);
    h.name = name + '_HALF__shell'; h.castShadow = true; h.receiveShadow = true;
    gHalf.add(h);

    var cg = capGeo(profile);
    var ct = new T.Mesh(cg, MATS.cutFace); ct.name = name + '_HALF__CAP_T';
    var cb = new T.Mesh(cg, MATS.cutFace); cb.name = name + '_HALF__CAP_B';
    cb.scale.y = -1;                       // 下半断面 = 上半镜像
    ct.castShadow = cb.castShadow = true;
    gHalf.add(ct, cb);

    ROOT.add(gFull, gHalf);
    window.__GLB_NODES.push(gFull.name, gHalf.name);
    return { full: gFull, half: gHalf };
  }

  /* 单个全圈回转件（不剖：轴上的实体，剖掉反而不像展示件） */
  function solid(name, profile, matKey, seg) {
    var g = new T.Group(); g.name = name;
    var m = new T.Mesh(latheX(profile, 0, TAU, seg || 64), MATS[matKey]);
    m.name = name + '__shell'; m.castShadow = true; m.receiveShadow = true;
    g.add(m); ROOT.add(g); window.__GLB_NODES.push(name);
    return g;
  }

  /* ══════════════════════════════════════════════════════════════
     几何尺寸（示意单位，1 单位 ≈ 0.1 m；风扇半径 7 ≈ 1.4 m 直径级，
     接近 CFM56 / LEAP 一类高涵道比涡扇的外廓比例）
     轴线沿 X：进气口在 -x，排气口在 +x。
     ══════════════════════════════════════════════════════════════ */

  /* 短舱：进气唇口 → 最大外径 → 外涵出口，带真实壁厚 0.4~1.1 */
  var NACELLE = [
    [-19.00, 7.50], [-18.85, 7.86], [-18.50, 8.10], [-17.80, 8.28],
    [-16.50, 8.34], [-13.00, 8.34], [-8.00, 8.26], [-3.00, 8.10],
    [ 1.00, 7.86], [ 3.20, 7.62],
    [ 3.20, 7.20], [ 1.00, 7.30], [-3.00, 7.36], [-8.00, 7.30],
    [-13.00, 7.16], [-16.00, 7.10], [-17.60, 7.16], [-18.60, 7.28]
  ];
  shellPair('NACELLE', NACELLE, 'nacelle', 96);

  /* 风扇机匣：风扇叶尖外侧的包容环，前后带法兰加厚 */
  var FANCASE = [
    [-17.00, 7.12], [-16.70, 7.34], [-16.30, 7.34], [-12.60, 7.30],
    [-12.30, 7.34], [-12.00, 7.12],
    [-12.00, 6.94], [-12.30, 6.96], [-16.30, 6.96], [-16.70, 6.96],
    [-17.00, 7.12]
  ];
  shellPair('FANCASE', FANCASE, 'fancase', 84);

  /* 核心机机匣：内涵道外壁，从增压级入口一路收到尾喷，中段燃烧室鼓起 */
  var CORECOWL = [
    [-12.00, 3.30], [-10.00, 3.05], [-6.00, 2.70], [-2.00, 2.35],
    [  0.00, 2.60], [ 3.00, 2.85], [ 7.00, 2.80], [11.00, 2.55],
    [ 15.00, 2.25], [18.00, 2.00],
    [ 18.00, 1.82], [15.00, 2.07], [11.00, 2.37], [ 7.00, 2.62],
    [  3.00, 2.67], [ 0.00, 2.42], [-2.00, 2.17], [-6.00, 2.52],
    [-10.00, 2.87]
  ];
  shellPair('CORECOWL', CORECOWL, 'core', 84);

  /* 尾喷管：收敛段，带壁厚 */
  var NOZZLE = [
    [17.50, 2.05], [20.00, 1.90], [22.50, 1.62],
    [22.50, 1.46], [20.00, 1.72], [17.50, 1.87]
  ];
  shellPair('NOZZLE', NOZZLE, 'hot', 72);

  /* 整流锥（随 LP 轴转）：抛物线尖锥，首尾落到轴线形成实体 */
  solid('SPINNER', [
    [-21.00, 0.00], [-20.60, 0.35], [-20.00, 0.78], [-19.20, 1.14],
    [-18.20, 1.44], [-17.20, 1.58], [-17.00, 1.58], [-17.00, 0.00]
  ], 'spinner', 56);

  /* 排气中心锥：涡轮后收敛的尾锥，实体 */
  solid('TAILCONE', [
    [14.00, 0.00], [15.00, 1.30], [18.00, 1.25], [21.00, 0.90],
    [24.00, 0.30], [24.60, 0.00]
  ], 'hot', 56);

  /* 进气唇口亮圈：单独一圈高亮金属，让唇缘在近景能读出圆角 */
  solid('LIPRING', [
    [-19.03, 7.48], [-19.06, 7.56], [-18.88, 7.90], [-18.82, 7.83],
    [-18.98, 7.50], [-19.03, 7.48]
  ], 'lip', 84);

  /* 短舱蒙皮接缝环 ×3：细金属环，放大后是"这是一台装配出来的机器"的证据 */
  [-12.0, -2.0, 1.6].forEach(function (x, k) {
    var r = 8.34 - Math.max(0, x + 12) * 0.045;
    var g = new T.Group(); g.name = 'SEAM_' + k;
    var ring = new T.Mesh(new T.TorusGeometry(r + .015, .035, 8, 84), MATS.dark);
    ring.name = 'SEAM_' + k + '__ring'; ring.rotation.y = PI / 2;
    ring.position.x = x; g.add(ring); ROOT.add(g);
    window.__GLB_NODES.push(g.name);
  });

  /* 风扇机匣法兰螺栓环 ×16：沿 x=-16.5 圆周，深色小圆柱 */
  (function () {
    var g = new T.Group(); g.name = 'FANBOLTS';
    var geo = new T.CylinderGeometry(.085, .085, .30, 8), i;
    for (i = 0; i < 16; i++) {
      var a = i / 16 * TAU;
      var b = new T.Mesh(geo, MATS.dark);
      b.name = 'FANBOLT_' + i;
      b.rotation.z = PI / 2;
      b.position.set(-16.50, Math.cos(a) * 7.36, Math.sin(a) * 7.36);
      g.add(b);
    }
    ROOT.add(g); window.__GLB_NODES.push(g.name);
  })();

  /* 挂架：有厚度的箱形结构梁 + 纵向加强筋 + 前后吊点，
     不是一块零厚度纸片（放大后要读得出"这是把发动机挂到机翼的结构件"） */
  (function () {
    var s = new T.Shape();
    s.moveTo(-9.0, 8.15); s.lineTo(6.0, 8.15); s.lineTo(12.5, 12.6);
    s.lineTo(2.0, 13.60); s.lineTo(-6.0, 13.60); s.lineTo(-12.0, 11.0);
    s.closePath();
    var g0 = new T.ExtrudeGeometry(s, {
      depth: 3.0, bevelEnabled: true, bevelSize: .26, bevelThickness: .26,
      bevelSegments: 2, curveSegments: 2, steps: 1
    });
    g0.translate(0, 0, -1.5);
    var m = new T.Mesh(g0, MATS.pylon);
    m.name = 'PYLON__shell'; m.castShadow = true; m.receiveShadow = true;
    var g = new T.Group(); g.name = 'PYLON'; g.add(m);

    /* 纵向加强筋：沿 x 贴在梁的上下缘，读出箱形梁的厚度层次 */
    [[-8.6, 11.4, 8.30], [-8.6, 11.4, 13.10]].forEach(function (d, k) {
      var rib = new T.Mesh(new T.BoxGeometry(d[1] - d[0], .30, 3.35), MATS.dark);
      rib.name = 'PYLON__rib_' + k;
      rib.position.set((d[0] + d[1]) / 2, d[2], 0);
      rib.castShadow = true; g.add(rib);
    });
    /* 前后吊点：把挂架真正"落"到短舱上，不悬空 */
    [-8.2, 4.2].forEach(function (x, k) {
      var lug = new T.Mesh(new T.CylinderGeometry(.52, .52, 1.9, 16), MATS.fancase);
      lug.name = 'PYLON__lug_' + k;
      lug.rotation.z = PI / 2;
      lug.position.set(x, 8.05, 0);
      lug.castShadow = true; g.add(lug);
      var pin = new T.Mesh(new T.CylinderGeometry(.20, .20, 3.6, 12), MATS.dark);
      pin.name = 'PYLON__pin_' + k;
      pin.rotation.x = PI / 2;
      pin.position.set(x, 8.05, 0);
      g.add(pin);
    });
    ROOT.add(g); window.__GLB_NODES.push(g.name);
  })();

  /* ══════════════════════════════════════════════════════════════
     宽弦风扇叶片（一片，课件里绕 X 轴克隆 22 片）
     NACA 对称厚度分布 + 弯度 + 展向扭转 + 后掠；上下表面 + 前后缘 +
     叶根/叶尖封口，是封闭实体而非薄板。放大 5–8 倍仍能看到翼型。
     ══════════════════════════════════════════════════════════════ */
  function bladeGeo() {
    var NR = 16, NC = 20, r0 = 1.55, r1 = 6.95;
    var P = (NR + 1) * (NC + 1), pos = [], uv = [], idx = [], s, i, j;
    function off(s, i, j) { return s * P + i * (NC + 1) + j; }
    for (s = 0; s < 2; s++) {
      for (i = 0; i <= NR; i++) {
        var t = i / NR, r = r0 + (r1 - r0) * t;
        var chord = 3.35 - 1.05 * t;                    // 叶根宽弦，叶尖略收
        var tw = (34 - 28 * t) * PI / 180;              // 安装角沿展向扭转
        var sweep = 1.95 * t * t;                       // 叶尖后掠
        var ct = Math.cos(tw), st = Math.sin(tw);
        for (j = 0; j <= NC; j++) {
          var c = j / NC;
          /* NACA 00-11.5 半厚，尾缘做闭合修正 */
          var yt = 5 * .115 * (0.2969 * Math.sqrt(c) - 0.1260 * c
                   - 0.3516 * c * c + 0.2843 * c * c * c - 0.1036 * c * c * c * c);
          var th = yt * chord * (s === 0 ? 1 : -1);
          var camber = .085 * Math.sin(PI * c) * chord;   // 弯度
          var xc = (c - 0.5) * chord, zc = th + camber;
          var px = xc * ct - zc * st + sweep;
          var pz = xc * st + zc * ct;
          pos.push(px, r, pz);
          uv.push(c, t);
        }
      }
    }
    /* 上下表面 */
    for (s = 0; s < 2; s++) {
      for (i = 0; i < NR; i++) {
        for (j = 0; j < NC; j++) {
          var A = off(s, i, j), B = off(s, i, j + 1),
              C = off(s, i + 1, j), D = off(s, i + 1, j + 1);
          if (s === 0) idx.push(A, B, D, A, D, C);
          else idx.push(A, D, B, A, C, D);
        }
      }
    }
    /* 前缘 / 后缘封口 */
    for (i = 0; i < NR; i++) {
      var u0 = off(0, i, 0), u1 = off(0, i + 1, 0),
          l0 = off(1, i, 0), l1 = off(1, i + 1, 0);
      idx.push(u0, l0, l1, u0, l1, u1);
      var u2 = off(0, i, NC), u3 = off(0, i + 1, NC),
          l2 = off(1, i, NC), l3 = off(1, i + 1, NC);
      idx.push(u2, u3, l3, u2, l3, l2);
    }
    /* 叶根 / 叶尖封口 */
    for (j = 0; j < NC; j++) {
      var a0 = off(0, 0, j), b0 = off(0, 0, j + 1),
          c0 = off(1, 0, j), d0 = off(1, 0, j + 1);
      idx.push(a0, b0, d0, a0, d0, c0);
      var a1 = off(0, NR, j), b1 = off(0, NR, j + 1),
          c1 = off(1, NR, j), d1 = off(1, NR, j + 1);
      idx.push(a1, d1, b1, a1, c1, d1);
    }
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();     // 顶点共享的连续曲面，平均法线不会出织物纹
    g.computeBoundingSphere();
    return g;
  }
  (function () {
    var m = new T.Mesh(bladeGeo(), MATS.blade);
    m.name = 'FANBLADE__shell'; m.castShadow = true; m.receiveShadow = true;
    var g = new T.Group(); g.name = 'FANBLADE'; g.add(m);
    ROOT.add(g); window.__GLB_NODES.push(g.name);
  })();

  /* ── 导出 binary GLB → base64 ── */
  function ab2b64(buf) {
    var bytes = new Uint8Array(buf), n = bytes.length, out = '', CH = 0x8000, i;
    for (i = 0; i < n; i += CH) {
      out += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CH, n)));
    }
    return btoa(out);
  }
  try {
    var exp = new T.GLTFExporter();
    exp.parse(ROOT, function (result) {
      if (!(result instanceof ArrayBuffer)) {
        window.__GLB_ERR = 'exporter did not return ArrayBuffer (binary flag ignored)';
        return;
      }
      window.__GLB_B64 = ab2b64(result);
      window.__GLB_BYTES = result.byteLength;
      window.__GLB_DONE = true;
    }, function (e) {
      window.__GLB_ERR = String(e && (e.stack || e.message || e));
    }, { binary: true, onlyVisible: false, trs: false });
  } catch (e) {
    window.__GLB_ERR = String(e && (e.stack || e));
  }
})();
</script>
</body>
</html>
