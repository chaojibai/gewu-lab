<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>六轴工业机械臂 · 真实 CAD 模型 (.glb)</title>
<style>
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#aeb7c0; overflow:hidden;
    font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:#dfe7ef; }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #hud { position:fixed; left:16px; top:14px; max-width:42%; pointer-events:none;
    text-shadow:0 1px 4px rgba(0,0,0,.55); }
  #hud .title { font-size:18px; font-weight:700; letter-spacing:.5px; color:#1d2530; }
  #hud .sub { font-size:12px; opacity:.85; margin-top:4px; color:#2a323d; }
  #hud .tip { font-size:12px; opacity:.95; margin-top:8px; color:#0a4a78; }
  #readout { margin-top:10px; font-size:12px; line-height:1.7; font-variant-numeric:tabular-nums;
    background:rgba(20,26,34,.72); border:1px solid rgba(150,175,200,.3); border-radius:8px;
    padding:8px 10px; display:inline-block; color:#dfe7ef; text-shadow:none; }

  #console { position:fixed; right:0; top:0; height:100%; width:344px; padding:16px 16px 28px;
    background:rgba(16,20,26,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-left:1px solid #2a323c; overflow-y:auto; font-size:13px; }
  #console h2 { font-size:14px; margin:14px 0 6px; color:#ff9a4d; font-weight:600;
    display:flex; justify-content:space-between; align-items:baseline; }
  #console h2 .hint { font-size:11px; color:#8aa0b4; font-weight:400; }
  #console h2:first-child { margin-top:2px; }

  .stick { position:relative; width:150px; height:150px; margin:12px auto 6px; border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #2a3340, #141a21); border:1px solid #3a4654;
    box-shadow:inset 0 2px 12px rgba(0,0,0,.6); touch-action:none; }
  .stick::before, .stick::after { content:""; position:absolute; background:rgba(120,150,180,.18); }
  .stick::before { left:50%; top:8%; width:1px; height:84%; transform:translateX(-.5px); }
  .stick::after  { top:50%; left:8%; height:1px; width:84%; transform:translateY(-.5px); }
  .knob { position:absolute; top:50%; left:50%; width:50px; height:50px; margin:-25px;
    border-radius:50%; background:radial-gradient(circle at 40% 35%, #ffb070, #c8521a);
    box-shadow:0 5px 14px rgba(0,0,0,.55), inset 0 1px 2px rgba(255,255,255,.4);
    touch-action:none; cursor:grab; }
  .knob:active { cursor:grabbing; }

  .slider-wrap { margin:9px 0; }
  .slider-lab { display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; }
  .slider-lab .deg { color:#9fd0ff; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; -webkit-appearance:none; appearance:none; height:5px; border-radius:3px;
    background:#2a3340; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#ff9a4d; border:2px solid #1a1206; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#ff9a4d;
    border:2px solid #1a1206; cursor:pointer; }

  .grip-row { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .grip-row input { flex:1; }
  .btn { background:#23303d; color:#dfe7ef; border:1px solid #3a4654; border-radius:8px;
    padding:9px 12px; cursor:pointer; font-size:13px; transition:background .15s; }
  .btn:hover { background:#2c3c4c; }
  .btn.on { background:#ff7a1a; color:#1a1206; border-color:#ff7a1a; font-weight:600; }
  .btn-row { display:flex; gap:10px; margin-top:14px; }
  .btn-row .btn { flex:1; }
  .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .btn-grid .btn { width:100%; }

  .legend { margin-top:16px; font-size:11px; color:#8aa0b4; line-height:1.7;
    border-top:1px solid #2a323c; padding-top:12px; }
  #loadnote { margin-top:10px; font-size:12px; color:#ffce6b; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="title">六轴工业机械臂 · 真实 CAD 模型</div>
    <div class="sub">鼠标拖动画面旋转视角 · 滚轮缩放 · 用右侧控制台操纵机械臂</div>
    <div class="tip">把夹爪移到蓝色料箱上方 → 夹紧即可抓起，移走再张开即放下</div>
    <div id="readout"></div>
  </div>

  <div id="console">
    <h2>操纵杆 <span class="hint">拖动控 基座回转 / 大臂俯仰</span></h2>
    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>

    <h2>关节控制</h2>
    <div id="sliders"></div>

    <h2>夹爪</h2>
    <div class="grip-row">
      <button id="gripBtn" class="btn">已张开 · 点击夹紧</button>
      <input type="range" id="grip" min="0" max="100" value="60">
    </div>

    <h2>响应速度 <span class="hint">越慢越“重”</span></h2>
    <input type="range" id="speed" min="1" max="10" value="4">

    <div class="btn-grid">
      <button id="reset" class="btn">复位</button>
      <button id="auto" class="btn">自动演示</button>
      <button id="postfx" class="btn on">后期 开</button>
      <button id="ik" class="btn">IK 点选</button>
    </div>

    <div id="loadnote">正在加载真实 .glb 模型…</div>

    <div class="legend">
      本体为 TRLC-DK1 六轴机械臂真实 CAD 网格（Apache-2.0），按 URDF 运动学链装配。<br>
      所有关节均有软限位；操纵杆与滑块双向同步。<br>
      末端坐标由正向运动学实时解算（TCP 世界坐标）。
    </div>
  </div>

  <script>/*THREEJS*/</script>
  <script>/*POSTFX*/</script>
  <script>/*GLTFLOADER*/</script>
  <script>/*GLB_ASSETS*/</script>
  <script>
  (function () {
    const THREE = window.THREE;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const TAU = Math.PI * 2;

    // ---------- renderer ----------
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    THREE.ColorManagement.legacyMode = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;

    const scene = new THREE.Scene();

    // studio backdrop (vertical gradient)
    (function () {
      const c = document.createElement('canvas'); c.width = 4; c.height = 256;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0, '#6b7684'); g.addColorStop(0.5, '#4a525c'); g.addColorStop(1, '#2e343c');
      x.fillStyle = g; x.fillRect(0, 0, 4, 256);
      const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; scene.background = t;
    })();

    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
    const camTarget = new THREE.Vector3(0, 2.0, 0);
    let camAz = 0.50, camPol = 1.20, camRad = 7.0;
    // 右侧控制台占 344px：把投影中心左移，让机械臂落在可视区中央
    function applyLens() {
      const w = window.innerWidth, h = window.innerHeight;
      const cw = (document.getElementById('console') || {}).offsetWidth || 0;
      camera.aspect = w / h;
      camera.setViewOffset(w, h, cw / 2, 0, w, h);
      camera.updateProjectionMatrix();
    }
    function updateCamera() {
      const sp = Math.sin(camPol), cp = Math.cos(camPol);
      camera.position.set(
        camTarget.x + camRad * sp * Math.sin(camAz),
        camTarget.y + camRad * cp,
        camTarget.z + camRad * sp * Math.cos(camAz)
      );
      camera.lookAt(camTarget);
    }

    // ---------- environment (reflections for metal) ----------
    function makeEnv() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 0, 512);
      g.addColorStop(0, '#f4f7fa'); g.addColorStop(0.5, '#cdd5dd'); g.addColorStop(1, '#7c8794');
      x.fillStyle = g; x.fillRect(0, 0, 1024, 512);
      x.fillStyle = 'rgba(255,255,255,0.95)';
      [120, 360, 600, 840].forEach(px => { x.fillRect(px - 26, 40, 52, 150); });
      x.fillStyle = 'rgba(190,210,230,0.55)';
      x.fillRect(40, 90, 120, 220); x.fillRect(880, 110, 110, 200);
      x.fillStyle = 'rgba(90,100,110,0.5)'; x.fillRect(0, 430, 1024, 82);
      const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping;
      const pm = new THREE.PMREMGenerator(renderer);
      const rt = pm.fromEquirectangular(t); t.dispose(); pm.dispose();
      return rt.texture;
    }
    scene.environment = makeEnv();

    // ---------- lights ----------
    scene.add(new THREE.HemisphereLight(0xeaf0f6, 0x6b7178, 0.36));
    const dir = new THREE.DirectionalLight(0xfff3e6, 1.12);
    dir.position.set(9, 17, 11); dir.castShadow = true;
    dir.shadow.mapSize.set(2048, 2048);
    dir.shadow.radius = 4; dir.shadow.bias = -0.0004;
    const sd = 12;
    dir.shadow.camera.left = -sd; dir.shadow.camera.right = sd;
    dir.shadow.camera.top = sd; dir.shadow.camera.bottom = -sd;
    dir.shadow.camera.near = 1; dir.shadow.camera.far = 70;
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xcfe2f2, 0.42); fill.position.set(-10, 8, 6); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xaecdf0, 0.55); rim.position.set(0, 9, -14); scene.add(rim);

    // ---------- floor ----------
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      new THREE.MeshStandardMaterial({ color: 0x4a5058, metalness: 0.0, roughness: 0.85, envMapIntensity: 0.25 })
    );
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    // subtle industrial floor grid
    (function () {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const x = c.getContext('2d');
      x.fillStyle = '#43494f'; x.fillRect(0, 0, 256, 256);
      x.strokeStyle = 'rgba(0,0,0,0.30)'; x.lineWidth = 3; x.strokeRect(1, 1, 254, 254);
      x.strokeStyle = 'rgba(255,255,255,0.045)'; x.lineWidth = 1;
      x.beginPath(); x.moveTo(128, 0); x.lineTo(128, 256); x.moveTo(0, 128); x.lineTo(256, 128); x.stroke();
      for (let i = 0; i < 500; i++) { x.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.025) + ')'; x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(38, 38);
      t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
      floor.material.map = t; floor.material.color.set(0xffffff);
      floor.material.needsUpdate = true;
    })();

    const blobTex = (function () {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const x = c.getContext('2d');
      const g = x.createRadialGradient(64, 64, 4, 64, 64, 62);
      g.addColorStop(0, 'rgba(0,0,0,0.5)'); g.addColorStop(0.6, 'rgba(0,0,0,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    function blob(size, y) {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(size, size),
        new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false })
      );
      m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m); return m;
    }
    const contactBlob = blob(7, 0.02);

    // ---------- scene dressing (work cell) ----------
    (function dress() {
      const mk = (geo, mat) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m; };

      // 地面黄黑警示环（环形斜纹，比圆柱端面干净）
      const annulusTex = (function () {
        const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
        const g = c.getContext('2d'); const cx = s / 2, cy = s / 2;
        const rOut = s * 0.465, rIn = s * 0.365;
        g.save();
        g.beginPath(); g.arc(cx, cy, rOut, 0, Math.PI * 2); g.arc(cx, cy, rIn, 0, Math.PI * 2, true); g.clip();
        g.fillStyle = '#c99a10'; g.fillRect(0, 0, s, s);
        g.fillStyle = '#17191d';
        for (let i = -s; i < s * 2; i += 50) {
          g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 25, 0); g.lineTo(i + 25 - s, s); g.lineTo(i - s, s); g.closePath(); g.fill();
        }
        g.restore();
        const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
      })();
      const ring = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 3.0),
        new THREE.MeshBasicMaterial({ map: annulusTex, transparent: true, depthWrite: false }));
      ring.rotation.x = -Math.PI / 2; ring.position.y = 0.014; scene.add(ring);

      // 工作单元地面划线（安全区）
      const markTex = (function () {
        const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
        const g = c.getContext('2d');
        g.strokeStyle = 'rgba(212,166,20,0.9)'; g.lineWidth = 7;
        g.strokeRect(24, 24, s - 48, s - 48);
        g.strokeStyle = 'rgba(230,236,242,0.28)'; g.lineWidth = 2;
        g.strokeRect(38, 38, s - 76, s - 76);
        g.strokeStyle = 'rgba(240,244,248,0.55)'; g.lineWidth = 6;
        [[24, 24, 1, 1], [s - 24, 24, -1, 1], [24, s - 24, 1, -1], [s - 24, s - 24, -1, -1]].forEach(([x, y, sx, sy]) => {
          g.beginPath(); g.moveTo(x, y + sy * 46); g.lineTo(x, y); g.lineTo(x + sx * 46, y); g.stroke();
        });
        // 通行方向箭头
        g.fillStyle = 'rgba(212,166,20,0.5)';
        for (let i = 0; i < 3; i++) {
          const x = 300 + i * 54, y = 256;
          g.beginPath(); g.moveTo(x, y - 16); g.lineTo(x + 28, y); g.lineTo(x, y + 16); g.closePath(); g.fill();
        }
        const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
      })();
      const mark = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 7.4),
        new THREE.MeshBasicMaterial({ map: markTex, transparent: true, depthWrite: false, opacity: 0.9 }));
      mark.rotation.x = -Math.PI / 2; mark.position.set(2.0, 0.01, -0.8); scene.add(mark);

      // ---- 安全围栏（立柱 + 双横杆 + 踢脚板 + 网格） ----
      const postMat = new THREE.MeshStandardMaterial({ color: 0xc79413, roughness: 0.55, metalness: 0.2, envMapIntensity: 0.5 });
      const railMat = new THREE.MeshStandardMaterial({ color: 0x40474f, roughness: 0.5, metalness: 0.55, envMapIntensity: 0.6 });
      const FZ = -4.0;
      for (let x = -4.2; x <= 4.2; x += 1.4) {
        const p = mk(new THREE.BoxGeometry(0.08, 1.08, 0.08), postMat);
        p.position.set(x, 0.54, FZ); scene.add(p);
        const cap = mk(new THREE.BoxGeometry(0.13, 0.05, 0.13), railMat);
        cap.position.set(x, 1.1, FZ); scene.add(cap);
      }
      [0.46, 0.98].forEach(y => {
        const r = mk(new THREE.BoxGeometry(8.5, 0.05, 0.05), railMat);
        r.position.set(0, y, FZ); scene.add(r);
      });
      const kick = mk(new THREE.BoxGeometry(8.5, 0.18, 0.03),
        new THREE.MeshStandardMaterial({ color: 0xb98d10, roughness: 0.6, metalness: 0.15 }));
      kick.position.set(0, 0.12, FZ); scene.add(kick);
      // 网格护栏片
      const meshTex = (function () {
        const c = document.createElement('canvas'); c.width = c.height = 64;
        const g = c.getContext('2d');
        g.strokeStyle = 'rgba(200,212,224,0.55)'; g.lineWidth = 2;
        for (let i = 0; i <= 64; i += 8) {
          g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 64); g.stroke();
          g.beginPath(); g.moveTo(0, i); g.lineTo(64, i); g.stroke();
        }
        const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(26, 4); return t;
      })();
      const fence = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 0.95),
        new THREE.MeshBasicMaterial({ map: meshTex, transparent: true, opacity: 0.35, depthWrite: false, side: THREE.DoubleSide }));
      fence.position.set(0, 0.62, FZ); scene.add(fence);

      // ---- 控制柜（HMI + 按钮 + 三色灯柱） ----
      const cabMat = new THREE.MeshStandardMaterial({ color: 0x33485c, roughness: 0.55, metalness: 0.28, envMapIntensity: 0.45 });
      const cabDark = new THREE.MeshStandardMaterial({ color: 0x1f2b36, roughness: 0.55, metalness: 0.3 });
      const cab = new THREE.Group(); cab.position.set(-4.15, 0, -3.0); cab.rotation.y = 0.52; scene.add(cab);
      const plinth = mk(new THREE.BoxGeometry(1.3, 0.12, 0.86), cabDark); plinth.position.y = 0.06; cab.add(plinth);
      const body = mk(new THREE.BoxGeometry(1.18, 1.62, 0.74), cabMat); body.position.y = 0.93; cab.add(body);
      const bezel = mk(new THREE.BoxGeometry(0.92, 0.86, 0.04), cabDark); bezel.position.set(0, 1.3, 0.38); cab.add(bezel);
      const hmi = (function () {
        const w = 256, h = 160, c = document.createElement('canvas'); c.width = w; c.height = h;
        const g = c.getContext('2d');
        g.fillStyle = '#071a2a'; g.fillRect(0, 0, w, h);
        g.strokeStyle = 'rgba(80,150,210,0.28)'; g.lineWidth = 1;
        for (let x = 0; x < w; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
        for (let y = 0; y < h; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
        g.strokeStyle = '#45e0a6'; g.lineWidth = 3; g.beginPath();
        for (let i = 0; i < 24; i++) {
          const x = 8 + i * 10, y = 106 - Math.sin(i * 0.6) * 32 - i * 1.2;
          i ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
        g.fillStyle = 'rgba(120,200,255,0.9)'; g.fillRect(12, 12, 62, 8); g.fillRect(12, 28, 40, 5);
        g.fillStyle = '#ffb454'; g.fillRect(160, 12, 82, 22);
        const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
      })();
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.37), new THREE.MeshBasicMaterial({ map: hmi }));
      scr.position.set(-0.06, 1.3, 0.405); cab.add(scr);
      const ledMat = new THREE.MeshStandardMaterial({ color: 0x0a1c12, emissive: 0x39ff9a, emissiveIntensity: 1.7 });
      for (let i = 0; i < 3; i++) {
        const b = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.03, 12), i === 0 ? ledMat : railMat);
        b.rotation.x = Math.PI / 2; b.position.set(0.32, 1.42 - i * 0.11, 0.41); cab.add(b);
      }
      // 顶部三色灯柱
      const stackBase = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.06, 12), cabDark);
      stackBase.position.set(0.32, 1.77, 0.1); cab.add(stackBase);
      [[0xff4b3a, 0.03], [0xffb02e, 0.12], [0x39ff9a, 0.21]].forEach(([col], i) => {
        const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, 0.09, 12),
          new THREE.MeshStandardMaterial({ color: 0x101418, emissive: col, emissiveIntensity: i === 2 ? 1.9 : 0.25 }));
        seg.position.set(0.32, 1.84 + i * 0.09, 0.1); cab.add(seg);
      });
      // 柜脚接触阴影
      const cabShadow = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.7),
        new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: 0.7 }));
      cabShadow.rotation.x = -Math.PI / 2; cabShadow.position.set(-4.15, 0.022, -3.0); scene.add(cabShadow);

      // ---- 沿护栏地面的走线槽（避免横穿安全环） ----
      const trayPts = [
        new THREE.Vector3(-4.0, 0.06, -3.25), new THREE.Vector3(-3.2, 0.055, -3.62),
        new THREE.Vector3(-1.2, 0.055, -3.64), new THREE.Vector3(2.4, 0.055, -3.64)
      ];
      const tray = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(trayPts), 36, 0.045, 8, false),
        new THREE.MeshStandardMaterial({ color: 0x1a2026, roughness: 0.9, metalness: 0.1 }));
      tray.castShadow = true; scene.add(tray);

      // ---- 背景墙 / 立柱 / 灯带 ----
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a414b, roughness: 0.9, metalness: 0.0, envMapIntensity: 0.2 });
      const wainMat = new THREE.MeshStandardMaterial({ color: 0x272e36, roughness: 0.85, metalness: 0.1 });
      const back = mk(new THREE.BoxGeometry(20, 7, 0.3), wallMat);

                               Math.abs(crate.position.x - PED_B.x) + Math.abs(crate.position.z - PED_B.z)) ? PED_B : PED_A;
      const gripW = () => crate.geometry.parameters.width / 2;
      demoSteps = [
        { run: () => setGrip(1), until: () => gripper > 0.85, max: 2 },
        { run: () => applyIK(tmpC.set(crate.position.x, crate.position.y + 0.7, crate.position.z).clone()),
          until: () => tipDist(tmpC.set(crate.position.x, crate.position.y + 0.7, crate.position.z)) < 0.4, max: 5 },
        { run: () => applyIK(tmpC.set(crate.position.x, crate.position.y + 0.04, crate.position.z).clone()),
          until: () => tipDist(tmpC.set(crate.position.x, crate.position.y + 0.04, crate.position.z)) < 0.35, max: 5 },
        { run: () => { demoPick = crate.position.clone(); demoDest = placeSpot(); setGrip(0); }, until: () => held, max: 3 },
        { run: () => applyIK(tmpC.set(demoPick.x, demoPick.y + 0.7, demoPick.z).clone()),
          until: () => tipDist(tmpC.set(demoPick.x, demoPick.y + 0.7, demoPick.z)) < 0.4, max: 5 },
        { run: () => applyIK(tmpC.set(demoDest.x, demoDest.top + 0.9, demoDest.z).clone()),
          until: () => tipDist(tmpC.set(demoDest.x, demoDest.top + 0.9, demoDest.z)) < 0.4, max: 5 },
        { run: () => {
            // aim tcp so the CRATE (not the tip) lands on the pedestal: compensate tool direction
            const P = tmpC.set(demoDest.x, demoDest.top + gripW(), demoDest.z);
            const off = new THREE.Vector3().copy(window.__tip()).sub(crate.position);
            applyIK(P.add(off));
          },
          until: () => { tmpC.set(demoDest.x, demoDest.top + gripW(), demoDest.z); return crate.position.distanceTo(tmpC) < 0.3; }, max: 5 },
        { run: () => setGrip(1), until: () => !held, max: 2 },
        { run: () => applyIK(tmpC.set(0.4, 2.4, 0.4).clone()), until: () => tipDist(tmpC.set(0.4, 2.4, 0.4)) < 0.45, max: 5 },
      ];
      const autoBtn = document.getElementById('auto');
      autoBtn.addEventListener('click', () => { auto = !auto; demoPhase = 0; demoRan = false; demoElapsed = 0; autoBtn.classList.toggle('on', auto); });
      window.__autoRef = { get: () => auto, set: v => { auto = v; demoPhase = 0; demoRan = false; demoElapsed = 0; autoBtn.classList.toggle('on', v); } };
      window.__demoState = () => ({ step: demoPhase, held: held });

      const postBtn = document.getElementById('postfx');
      postBtn.addEventListener('click', () => { postOn = !postOn; postBtn.classList.toggle('on', postOn); postBtn.textContent = '后期 ' + (postOn ? '开' : '关'); });

      const ikBtn = document.getElementById('ik');
      ikBtn.addEventListener('click', () => { ikMode = !ikMode; ikBtn.classList.toggle('on', ikMode); if (!ikMode) marker.visible = false; });
    }

    function setGrip(v) {
      gripperTarget = clamp(v, 0, 1);
      document.getElementById('grip').value = Math.round(gripperTarget * 100);
      document.getElementById('gripBtn').textContent = gripperTarget < 0.5 ? '已闭合 · 点击张开' : '已张开 · 点击夹紧';
    }

    // ---------- inverse kinematics (numeric, joint-limited) ----------
    let ikMode = false, marker = null, moved = false, downX = 0, downY = 0;
    const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
    const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpQ = new THREE.Quaternion();

    // pure-math FK over the URDF chain (metres, z-up): j1..j5 (j6 spins tool only)
    const AXES = [
      { t: [0, 0, 0.0615],          r: [0, 0, 1] },
      { t: [0.02, 0, 0.0385],       r: [0, 1, 0] },
      { t: [-0.264, 0, 0],          r: [0, -1, 0] },
      { t: [0.244004, 0, 0.059971], r: [0, -1, 0] },
      { t: [0.061868, 0, 0.0425],   r: [0, 0, -1] },
    ];
    const JLIM = [[-2.094, 2.094], [-0.01, 3.141], [-0.01, 4.712], [-1.95, 1.57], [-1.57, 1.57]];
    const _fkM = new THREE.Matrix4(), _fkT = new THREE.Matrix4(), _fkR = new THREE.Matrix4(), _fkV = new THREE.Vector3();
    function fkTCP(a, off) {
      if (off === undefined) off = 0.158;
      _fkM.identity();
      for (let i = 0; i < 5; i++) {
        const s = AXES[i];
        _fkT.makeTranslation(s.t[0], s.t[1], s.t[2]);
        _fkR.makeRotationAxis(_fkV.set(s.r[0], s.r[1], s.r[2]), a[i]);
        _fkM.multiply(_fkT).multiply(_fkR);
      }
      return new THREE.Vector3(off, 0, 0).applyMatrix4(_fkM);
    }

    function solveIK(lt, seed) {                  // lt: local target (z-up metres)
      const cur = joints.map(j => j.target);
      const clampA = a => { for (let i = 0; i < 5; i++) a[i] = Math.min(JLIM[i][1], Math.max(JLIM[i][0], a[i])); return a; };
      const cost = a => {
        const p = fkTCP(a);
        const d2 = (p.x - lt.x) ** 2 + (p.y - lt.y) ** 2 + (p.z - lt.z) ** 2;
        let reg = 0; for (let i = 0; i < 5; i++) reg += (a[i] - cur[i]) ** 2;
        return d2 + 0.008 * reg;                  // prefer small change from current pose
      };
      const starts = [
        clampA(seed.slice(0, 5)),
        [0, 1.6, 0.9, 0, 0],
        [0, 2.3, 1.6, -1.0, 0],
        [0.6, 1.9, 1.3, -0.6, 0.5],
        [-0.6, 1.9, 1.3, -0.6, -0.5],
      ];
      let best = null, bd = Infinity;
      for (const s0 of starts) {
        let a = s0.slice(), f = cost(a), step = 0.4;
        for (let iter = 0; iter < 80 && step > 0.003; iter++) {
          let improved = false;
          for (let i = 0; i < 5; i++) {
            for (const d of [step, -step]) {
              const t = a.slice(); t[i] += d; clampA(t);
              const c = cost(t);
              if (c < f - 1e-9) { f = c; a = t; improved = true; }
            }
          }
          if (!improved) step *= 0.5;
        }
        if (f < bd) { bd = f; best = a; }
      }
      const p = fkTCP(best);
      return { angles: best, err: Math.hypot(p.x - lt.x, p.y - lt.y, p.z - lt.z) };
    }

    function applyIK(p) {                         // p: world-space target
      const local = p.clone(); robotRoot.worldToLocal(local);
      const r = solveIK(local, joints.map(j => j.target));
      for (let i = 0; i < 5; i++) joints[i].target = r.angles[i];
      syncJoyFromJoints();
      window.__lastIK = { err: r.err, target: [p.x, p.y, p.z].map(v => +v.toFixed(2)) };
      return r;
    }

    function setupIK() {
      marker = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), new THREE.MeshBasicMaterial({ color: 0x39d98a }));
      marker.visible = false; scene.add(marker);

      window.__ik = (x, y, z) => {
        const r = applyIK(new THREE.Vector3(x, y, z));
        return { err: +r.err.toFixed(3), angles: r.angles.map(v => +v.toFixed(2)) };
      };
      window.__tip = () => { const v = new THREE.Vector3(); if (tcp) tcp.getWorldPosition(v); return v; };
      window.__setSpeed = (v) => { speed = v; };
      window.__grip = (v) => setGrip(v);
      window.__held = () => held;
      window.__crate = () => { const v = new THREE.Vector3(); crate.getWorldPosition(v); return v; };
    }

    function wirePointer() {
      let dragging = false, lastX = 0, lastY = 0;
      canvas.addEventListener('pointerdown', e => {
        dragging = true; moved = false; downX = e.clientX; downY = e.clientY;
        lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointerup', e => {
        dragging = false;
        if (ikMode && !moved) {
          ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
          ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
          ray.setFromCamera(ndc, camera);
          const hitC = ray.intersectObject(crate);
          let p;
          if (hitC.length) { p = crate.position.clone(); }
          else {
            p = new THREE.Vector3();
            if (!ray.ray.intersectPlane(ground, p)) return;
            p.y = 0.3;
          }
          marker.position.copy(p); marker.visible = true;
          applyIK(p);
        }
      });
      canvas.addEventListener('pointermove', e => {
        if (dragging && (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4)) moved = true;
        if (!dragging) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        camAz -= dx * 0.005;
        camPol = clamp(camPol - dy * 0.005, 0.15, Math.PI / 2 - 0.04);
      });
      canvas.addEventListener('wheel', e => { e.preventDefault(); camRad = clamp(camRad + e.deltaY * 0.01, 6, 60); }, { passive: false });
    }

    // ---------- grab (seat crate between fingertips, rigid follow) ----------
    function updateGrab() {
      tcp.getWorldPosition(tmpA);
      crate.getWorldPosition(tmpB);
      const d = tmpA.distanceTo(tmpB);
      if (!held && gripper < 0.18 && d < 0.7) {
        held = true;
        // seat the crate at a fixed offset inside link6-7 frame: no jump, no swing
        crate.position.copy(linkG['link6-7'].localToWorld(tmpHold.copy(heldLocal)));
        crate.quaternion.copy(linkG['link6-7'].getWorldQuaternion(tmpQ));
      } else if (held && gripper > 0.5) {
        held = false;
        // seat on a pedestal if released just above one (never sink into it)
        if (PED_A && PED_B) {
          for (const s of [PED_A, PED_B]) {
            tmpC.set(s.x, s.top + crate.geometry.parameters.width / 2, s.z);
            if (crate.position.distanceTo(tmpC) < 0.4) { crate.position.copy(tmpC); break; }
          }
        }
        // set the crate down square: keep only yaw, snapped to the nearest 90°
        const e = new THREE.Euler().setFromQuaternion(crate.quaternion, 'YXZ');
        const yaw = Math.round(e.y / (Math.PI * 0.5)) * (Math.PI * 0.5);
        settleFrom.copy(crate.quaternion);
        settleQ.setFromEuler(new THREE.Euler(0, yaw, 0));
        settle = 1;
      }
      if (held) {
        crate.position.copy(linkG['link6-7'].localToWorld(tmpHold.copy(heldLocal)));
        crate.quaternion.copy(linkG['link6-7'].getWorldQuaternion(tmpQ));
      }
    }

    // 抓取反馈：吸附提示环 + 料箱高亮 + TCP 残影（纯视觉，不参与判定）
    function updateFeedback(dt) {
      if (!tcp || !snapRing || !crate) return;
      fbT += dt;
      tcp.getWorldPosition(fbTip);
      crate.getWorldPosition(fbCrate);
      const d = fbTip.distanceTo(fbCrate);
      const half = crate.geometry.parameters.width / 2;
      if (held) {
        snapRing.visible = false;
        crateMat.emissive.setHex(0x1f5c34);
        crateMat.emissiveIntensity = 0.9;
      } else {
        snapRing.visible = d < 0.95;
        if (snapRing.visible) {
          snapRing.position.set(fbCrate.x, fbCrate.y - half + 0.012, fbCrate.z);
          const k = clamp((0.95 - d) / 0.95, 0, 1);
          snapRing.material.opacity = 0.2 + k * 0.65;
          snapRing.material.color.setHex(d < 0.72 ? 0x5bff9a : 0x66d8ff);
          snapRing.scale.setScalar(1 + Math.sin(fbT * 4) * 0.06);
        }
        const near = clamp((0.95 - d) / 0.95, 0, 1);
        crateMat.emissive.setHex(d < 0.72 ? 0x1d6a42 : 0x06233f);
        crateMat.emissiveIntensity = 0.2 + near * 0.5 + Math.sin(fbT * 4) * 0.08 * near;
      }
      // TCP 轨迹残影
      if (fbTip.distanceTo(trailLast) > 0.02) {
        trailLast.copy(fbTip); trailPts.push(fbTip.clone());
        while (trailPts.length > TRAIL_N) trailPts.shift();
      }
      if (trail && trailPts.length >= 2) {
        for (let i = 0; i < TRAIL_N; i++) {
          const p = trailPts[Math.min(i, trailPts.length - 1)];
          trailPos[i * 3] = p.x; trailPos[i * 3 + 1] = p.y; trailPos[i * 3 + 2] = p.z;
        }
        trailGeo.attributes.position.needsUpdate = true;
        trailGeo.setDrawRange(0, TRAIL_N);
        trail.visible = true;
      }
    }

    // ---------- readout ----------
    const readout = document.getElementById('readout');
    const tipV = new THREE.Vector3();
    function updateReadout() {
      tcp.getWorldPosition(tipV);
      let s = `末端坐标  X ${tipV.x.toFixed(2)}  Y ${tipV.y.toFixed(2)}  Z ${tipV.z.toFixed(2)}<br>`;
      joints.forEach((j, i) => { s += `${j.name.split(' ')[0]} ${(j.cur * 180 / Math.PI).toFixed(0)}°  `; });
      s += `<br>夹爪 ${gripper < 0.2 ? '已闭合' : gripper > 0.8 ? '已张开' : '运动中'}${held ? ' · 已抓持' : ''}`;
      readout.innerHTML = s;
      joints.forEach((j, i) => { sliderRefs[i].deg.textContent = `${(j.cur * 180 / Math.PI).toFixed(0)}°`; });
    }

    // ---------- animation ----------
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const k = 1 - Math.exp(-speed * 60 * dt);

      if (window.__autoRef && window.__autoRef.get() && demoSteps) {
        demoElapsed += dt;
        const st = demoSteps[demoPhase];
        if (!st) { demoPhase = 0; demoRan = false; demoElapsed = 0; }
        else {
          if (!demoRan) { st.run(); demoRan = true; }
          const done = demoElapsed > st.max || (demoElapsed > 0.6 && st.until && st.until());
          if (done) { demoPhase = (demoPhase + 1) % demoSteps.length; demoRan = false; demoElapsed = 0; }
        }
      }

      joints.forEach(j => {
        j.target = clamp(j.target, j.min, j.max);
        j.cur += (j.target - j.cur) * k;
        applyJoint(j, j.cur);
      });

      gripper += (gripperTarget - gripper) * k;
      // prismatic gripper: value 0.02 (closed) .. -0.14 (open), metres
      const fv = 0.02 - gripper * 0.16;
      fingerL.position.y = fv;
      fingerR.position.y = -fv;

      updateGrab();
      if (settle > 0) {                              // crate squares itself after release
        settle = Math.max(0, settle - dt * 5);
        crate.quaternion.slerpQuaternions(settleFrom, settleQ, 1 - settle);
      }
      updateFeedback(dt);
      updateReadout();
      updateCamera();
      renderFrame();
    }

    // ---------- resize ----------
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      applyLens();
      if (composer) composer.setSize(w, h);
    }
    window.addEventListener('resize', resize); resize();
  })();
  </script>
</body>
